<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <script src="../js/no-zoom.js"></script>
  <title>Tower</title>
  <link rel="stylesheet" href="css/tower.css">
  <style>body { margin: 0; background: #f4f6fb; }</style>
</head>
<body>
  <div id="tower"></div>
  <script type="module">
    // The app is not playable without a name (see js/name-gate.js): this standalone page is a
    // door into the hub too. `requireName()` is a no-op once this device has a name.
    import { requireName } from '../js/name-gate.js';
    import { init } from './js/ui.js';
    await requireName();
    init(document.getElementById('tower'));
  </script>
</body>
</html>
