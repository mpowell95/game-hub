<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gridlock</title>
  <link rel="stylesheet" href="../css/ui.css">
  <link rel="stylesheet" href="css/gridlock.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f4f6fb; }
    :root.gh-dark, :root.gh-dark body { background: #0e1420; }
    #gridlock { min-height: 100vh; position: relative; }
  </style>
</head>
<body>
  <div id="gridlock"></div>
  <script type="module">
    // The app is not playable without a name (see js/name-gate.js): this standalone page is a
    // door into the hub too. `requireName()` is a no-op once this device has a name.
    import { requireName } from '../js/name-gate.js';
    import { init } from './js/ui.js';
    await requireName();
    init(document.getElementById('gridlock'));
  </script>
</body>
</html>
