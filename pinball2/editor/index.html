<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>Pinball 2 table editor</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #16203a;
    --line: #2a3856;
    --ink: #e9eef7;
    --dim: #9db0cd;
    --accent: #ffce3a;
    --ok: #35c07a;
    --bad: #ff5a5a;
    /* The table's row height. Everything else takes what is left, and the dock scrolls inside it. */
    --stage-h: 56svh;
  }
  /* NOTHING IN THIS TOOL IS TEXT TO BE SELECTED. Matt, on the press-and-hold fine drag: "it also
     selects everything, the whole page, as if I was going to copy something."
     A long press is the OS gesture for "select this text", and it fires on the way to every fine
     drag by definition, so the tool cannot have one without the other unless selection is off. The
     highlight also repaints the whole page mid-drag, which is the worst possible moment.
     Inputs are the exception and get it back below: a number field you cannot select inside is a
     number field you cannot correct. */
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;        /* and no "Copy / Look Up" bubble either */
  }
  input, textarea, select { -webkit-user-select: text; user-select: text; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 14px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overscroll-behavior: none;
  }
  /* THE WORKSPACE IS A GRID AND THE CANVAS ROW IS A FIXED SIZE. That is the whole point of this
     layout, and it is not only tidiness: the canvas used to be a flex child that grew and shrank
     with whatever the panel below it happened to contain, so switching tabs resized it with no
     window resize event, the view transform still described the previous height, and every tap
     landed an inch from the finger. A ResizeObserver patches that; a fixed row means there is
     nothing to patch. The dock scrolls INSIDE its own row and cannot push the table around.

     svh, not vh or dvh: dvh changes as the phone's URL bar slides and would resize the canvas on
     every scroll, which is the bug again wearing a different hat. */
  #app {
    display: grid;
    grid-template-rows: auto var(--stage-h) auto minmax(0, 1fr);
    grid-template-areas: "hdr" "stage" "objbar" "dock";
    height: 100%; height: 100svh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { grid-area: hdr; display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 13px; margin: 0 4px 0 0; font-weight: 700; letter-spacing: .04em; color: var(--dim); white-space: nowrap; }
  .tabs { display: flex; gap: 4px; width: 100%; }
  .tabs .tab { flex: 1; }
  #build { min-height: 26px; padding: 3px 8px; font-size: 11px; font-weight: 700; border-radius: 6px;
           border: 1px solid var(--line); background: #101a2e; color: var(--dim); }
  #build.stale { background: #5c2b36; border-color: #8a3d4d; color: #ffd7d7; }
  .tab { min-height: 34px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: #101a2e; color: var(--dim); font-size: 13px; font-weight: 600; }
  .tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #21180a; }

  /* The zoom cluster lives in the top bar now, so it is reachable in every mode rather than only
     while the Edit panel happens to be open. */
  /* The title is decoration and a phone has no room for it: the tab strip and the table selector
     both say where you are, and the selector needs the space more. */
  @media (max-width: 620px) { header h1 { display: none; } }
  #tablesel { min-width: 0; flex: 1 1 120px; max-width: 190px; height: 30px; padding: 3px 6px; font-size: 12px;
              background: #101a2e; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }
  #zoombar { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  #zoombar button { min-height: 28px; min-width: 34px; padding: 4px 8px; font-size: 13px; }
  #zoomval { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }

  #stage { grid-area: stage; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  /* Object controls, every mode. They used to be inside the Edit panel, which meant undo was
     unreachable the moment you switched to Tune to see what a slider did. */
  #objbar { grid-area: objbar; display: flex; gap: 4px; padding: 5px 8px; border-top: 1px solid var(--line); background: #101a2e; overflow-x: auto; }
  #objbar button { flex: 1 0 auto; min-height: 34px; padding: 6px 9px; font-size: 12px; white-space: nowrap; }
  /* pre-wrap, not pre: the line naming what is on the table runs past the right edge of a phone
     otherwise, and a line you cannot finish reading is not a line that answers anything. */
  #hud { position: absolute; left: 8px; top: 8px; max-width: calc(100% - 16px); font-size: 11px; color: var(--dim); background: rgba(8,14,26,.66); padding: 4px 7px; border-radius: 6px; pointer-events: none; white-space: pre-wrap; }
  /* ONE dock on a phone, holding both halves stacked and scrolling as one. On a wide screen the
     same two halves become the left and right docks: `display: contents` drops this wrapper out of
     the layout so its children land in the grid directly. Same DOM, same code, two shapes. */
  #panel { grid-area: dock; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; border-top: 1px solid var(--line); background: var(--panel); }
  /* With a part selected, the inspector is the thing you came to the dock for, so on a phone it
     jumps above the palette. On a wide screen the grid places both halves and order is moot. */
  #panel.sel #dockB { order: -1; }
  #panel.hidden { display: none; }
  #dockA, #dockB { padding: 8px; }
  #dockB:empty { display: none; }
  #dockA:not(:empty) + #dockB:not(:empty) { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .row > label { font-size: 11px; color: var(--dim); min-width: 74px; }
  input[type=number], input[type=text], select {
    background: #0d1729; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 8px; font-size: 13px; width: 88px; min-height: 34px;
  }
  input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); height: 34px; }
  button {
    min-height: 38px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: #1d2b46; color: var(--ink); font-size: 13px; font-weight: 600;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #21180a; }
  button.danger { background: #3a1b24; border-color: #5c2b36; color: #ffb3b3; }
  button:disabled { opacity: .45; }
  .val { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--accent); min-width: 54px; text-align: right; }
  .note { font-size: 11px; color: var(--dim); margin: 4px 0 8px; }
  .fail { color: var(--bad); font-weight: 700; }
  .pass { color: var(--ok); font-weight: 700; }
  pre#report { font-size: 11px; line-height: 1.45; white-space: pre-wrap; margin: 6px 0 0; color: var(--dim); }
  #touchzones { position: absolute; inset: 0; display: none; }
  #touchzones.on { display: block; }
  #touchzones div { position: absolute; bottom: 0; top: 40%; width: 46%; }
  #tz-l { left: 0; } #tz-r { right: 0; }
  #launch { position: absolute; right: 10px; bottom: 10px; }
  h2 { font-size: 12px; margin: 10px 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }

  /* The parts palette: an icon per kind, so a part is recognised rather than read. */
  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 6px; margin-bottom: 8px; }
  .palette button { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 54px; padding: 6px 4px; font-size: 11px; }
  .palette svg { width: 26px; height: 18px; display: block; }

  /* Collapsible groups. Tune was one unbroken list of 22 sliders, so reaching Ramp drag meant
     scrolling past everything else on the table. */
  details.grp { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: #101a2e; }
  details.grp > summary { list-style: none; cursor: pointer; padding: 9px 10px; font-size: 12px; font-weight: 700;
                          color: var(--dim); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
  details.grp > summary::-webkit-details-marker { display: none; }
  details.grp > summary::after { content: '+'; margin-left: auto; font-size: 15px; color: var(--dim); }
  details.grp[open] > summary::after { content: '\2212'; }
  details.grp[open] > summary { border-bottom: 1px solid var(--line); color: var(--accent); }
  details.grp .grp-body { padding: 8px 10px 2px; }
  details.grp.sel > summary { color: var(--accent); }
  details.grp.sel { border-color: var(--accent); }

  /* WIDE SCREEN: the docks the brief asked for. The canvas is still a fixed box that never moves;
     the two dock halves simply sit either side of it instead of stacked underneath. */
  @media (min-width: 900px) {
    #app {
      grid-template-columns: 210px minmax(0, 1fr) 320px;
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "hdr hdr hdr" "dockA stage dockB" "objbar objbar objbar";
    }
    #panel { display: contents; }
    #dockA { grid-area: dockA; overflow-y: auto; overscroll-behavior: contain; border-right: 1px solid var(--line); background: var(--panel); }
    #dockB { grid-area: dockB; overflow-y: auto; overscroll-behavior: contain; border-left: 1px solid var(--line); background: var(--panel); }
    #dockA:not(:empty) + #dockB:not(:empty) { border-top: 0; }
    #dockB:empty { display: block; }
    #stage { background: #0a1220; }
    .tabs { width: auto; margin-left: 10px; }
    .tabs .tab { flex: 0 0 auto; }
    .palette { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>PINBALL 2</h1>
    <button id="build" title="which build is running">...</button>
    <select id="tablesel" title="which table you are editing"></select>
    <div id="zoombar">
      <span id="zoomval">100%</span>
      <button id="zoom-out" title="zoom out">&minus;</button>
      <button id="zoom-in" title="zoom in">+</button>
      <button id="zoom-fit">Fit</button>
    </div>
    <div class="tabs">
      <button class="tab" id="tab-play" aria-pressed="true">Play</button>
      <button class="tab" id="tab-edit" aria-pressed="false">Edit</button>
      <button class="tab" id="tab-tune" aria-pressed="false">Tune</button>
      <button class="tab" id="tab-check" aria-pressed="false">Check</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <div id="touchzones"><div id="tz-l"></div><div id="tz-r"></div></div>
    <button id="launch" class="primary">Launch</button>
  </div>
  <div id="objbar">
    <button id="ob-undo">Undo</button>
    <button id="ob-redo">Redo</button>
    <button id="ob-snap">Snap on</button>
    <button id="ob-dup">Duplicate</button>
    <button id="ob-del" class="danger">Delete</button>
  </div>
  <div id="panel"><div id="dockA"></div><div id="dockB"></div></div>
</div>
<!-- EVERY MODULE IN THIS TOOL IS FETCHED WITH THE BUILD VERSION IN ITS URL, and that is not
     decoration.

     Matt, on a build whose version chip read v782: a screenshot of the bare box from hours earlier,
     with none of the bumpers, slingshots or the ramp in it. The chip was telling the truth about
     the service worker; the MODULE GRAPH was older. Between the browser's own HTTP cache, the
     service worker's cache, and the slow-connection latch that can serve a cached copy even on a
     network-first path, there are three separate places a stale table.js can come from, and the
     version chip can see none of them.

     A URL with the build in it is a different URL, so no cache belonging to an older build can
     answer it. It has to be done HERE rather than with `import(...?v=)` inside editor.js, because
     that would only version the five modules editor.js names itself: render.js imports physics.js
     and checks.js imports physics.js and config.js, and those relative specifiers would resolve
     unversioned and could still come back stale, which is worse than the original bug because the
     build would then be MIXED. An import map keyed on the resolved URLs catches the transitive
     ones too, which is the whole module graph.

     The map must be installed before any module loads, hence the classic script and the module tag
     being appended rather than written inline. Offline, version.json cannot be read and the map is
     skipped entirely: the tool then loads exactly as it did before any of this, from cache. -->
<script>
(function () {
  var base = new URL('../', location.href).href;                    // .../pinball2/
  var MODULES = [
    'machines/testbox/config.js',
    'machines/testbox/physics.js',
    'machines/testbox/table.js',
    'machines/testbox/render.js',
    'probes/checks.js',
  ];

  function start(build) {
    var q = build ? '?v=' + encodeURIComponent(build) : '';
    if (build) {
      var map = { imports: {} };
      for (var i = 0; i < MODULES.length; i++) {
        map.imports[base + MODULES[i]] = base + MODULES[i] + q;
      }
      var im = document.createElement('script');
      im.type = 'importmap';
      im.textContent = JSON.stringify(map);
      document.head.appendChild(im);
    }
    // editor.js is NOT in the map: an import map remaps specifiers resolved INSIDE modules, never
    // the src of a script tag, so the entry point has to carry the version itself.
    var s = document.createElement('script');
    s.type = 'module';
    s.src = './editor.js' + q;
    document.body.appendChild(s);
  }

  var done = false;
  function once(build) { if (!done) { done = true; start(build); } }

  // A hung request must never leave the tool blank, so the unversioned load is the fallback.
  setTimeout(function () { once(null); }, 4000);

  fetch('../../version.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) { once(j && j.cache ? String(j.cache) : null); })
    .catch(function () { once(null); });
})();
</script>
</body>
</html>
