<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arrow Maze</title>
  <link rel="stylesheet" href="../css/ui.css">
  <link rel="stylesheet" href="css/way-out.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1f1f2d; }
    #way-out { min-height: 100vh; position: relative; }
  </style>
</head>
<body>
  <div id="way-out"></div>
  <script type="module">
    // The app is not playable without a name (see js/name-gate.js): this standalone page is a
    // door into the hub too. `requireName()` is a no-op once this device has a name.
    import { requireName } from '../js/name-gate.js';
    import { init } from './js/ui.js';
    await requireName();
    init(document.getElementById('way-out'));
  </script>
</body>
</html>
