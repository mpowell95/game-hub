<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e2a17f">
  <title>Mancala</title>
  <link rel="stylesheet" href="css/mancala.css">
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #f4f6fb;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      /* NO DECORATIVE PADDING ON A GAME PAGE. This was `16px 8px 40px` - 56px of chrome around
         a game that already lays out to fill the screen, and 56px of the 160px by which this page
         overflowed a 664px phone (2026-09-08). Chinchon's own page carries the same note from
         2026-09-01; mancala was the other odd one out. The home-indicator clearance is kept,
         honestly, via env(). */
      padding: 0 8px env(safe-area-inset-bottom, 0px);
    }
    /* A flex item's default `min-width: auto` is its min-content, so without this the game can
       refuse to shrink and the page scrolls sideways instead (see chinchon/index.html). */
    #mancala { width: 100%; max-width: 820px; min-width: 0; }
  </style>
</head>
<body>
  <div id="mancala"></div>

  <!-- Standalone host. In the hub, the shell calls init(container)/destroy() instead. -->
  <script type="module">
    // The app is not playable without a name (see js/name-gate.js): this standalone page is a
    // door into the hub too, and an ungated one is where the leaderboard's nameless device
    // records came from. `requireName()` is a no-op once this device has a name.
    import { requireName } from '../js/name-gate.js';
    import { init } from './js/ui.js';
    await requireName();
    init(document.getElementById('mancala'));
  </script>
</body>
</html>
