<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yahtzee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{
  /* header */
  --hdr-top:#D53922;  --hdr-bot:#CB3219;
  --pod-active:#F4584A;
  --pod-idle:#7B1B0F;
  --hdr-text:#FFFFFF;

  /* rules under the header */
  --gold-rule:#FBBB01;  --amber-shadow:#B74A0D;  --orange-strip:#FBA62F;

  /* playfield */
  --blue-field:#0878CE;  --cyan-rim:#10AEEF;  --cyan-rim-hi:#84DCF1;
  --teal-inset:#067299;

  /* scorecard */
  --card-border:#EAB74D;  --card-border-lo:#B1640A;  --card-hi:#FEFAEE;
  --row-a:#FDCF61;
  --row-b:#F7BC4C;
  --groove-dark:#D89334;  --groove-light:#FFDC8E;
  --divider:#FCF6F3;

  /* score boxes */
  --box-top:#FFF5D3;  --box-bot:#FDD08F;  --box-border:#C1894B;
  --box-inner-shadow:rgba(140,80,10,.38);

  /* numerals */
  --ink:#8B4A0C;
  --ink-ghost:rgba(139,74,12,.45);

  /* category icons */
  --icon-red-top:#FE4B4B;  --icon-red-bot:#CB2222;  --icon-red-edge:#9E1515;
  --icon-white:#FFFFFF;    --yahtzee-gold:#FFC93C;

  /* dice */
  --die-top:#FFFFFF;  --die-bot:#E3DDD0;  --die-edge:#B9B2A4;  --pip:#15181C;
  --die-hold:#FFD54A;

  /* buttons */
  --roll-rim:#0A88C4;  --roll-a:#9BF2FA; --roll-b:#33FEFE; --roll-c:#04D5F2;
  --roll-d:#027BAD;    --roll-lip:#012B4B;
  --play-on-a:#8CD44C; --play-on-b:#3F7A1B; --play-lip:#1F4A0A;
  --play-off-a:#4F822D; --play-off-b:#29650F; --play-off-text:#90958E;
}

* { box-sizing: border-box; }

body{
  background:#fff;
  display:grid;
  place-items:center;
  height:100vh;
  margin:0;
  overflow:hidden;
  font-family:"Baloo 2","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}

#fit{
  transform-origin: center center;
}

#stage{
  position:relative;
  width:410px;
  height:730px;
  overflow:hidden;
  background:#fff;
}

.abs{ position:absolute; }

/* ---------- Header ---------- */
.hdr{
  position:absolute; left:0; top:0; width:410px; height:64px;
  background:linear-gradient(180deg,var(--hdr-top),var(--hdr-bot));
}

.chevron{ position:absolute; left:24px; top:24px; width:12px; height:20px; }

.pod{
  position:absolute; top:12px; width:130px; height:47px; border-radius:24px;
  transition: background-color .25s ease;
}
.pod.p1{ left:75px; width:130px; }
.pod.p2{ left:204px; width:126px; }
.pod.active{ background:var(--pod-active); }
.pod.idle{ background:var(--pod-idle); }

.pod-total{
  position:absolute; left:45px; top:0; font:800 30px/1 "Baloo 2",sans-serif;
  color:var(--hdr-text); white-space:nowrap;
}
.pod.p1 .pod-total{ transform:translateY(19px); }
.pod.p2 .pod-total{ left:28px; transform:translateY(19px); }

.pod-name{
  position:absolute; left:45px; top:0; font:700 13px/1 "Baloo 2",sans-serif;
  color:var(--hdr-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:78px;
  transform:translateY(41px);
}
.pod.p2 .pod-name{ left:28px; }

.avatar{
  position:absolute; top:31px; transform:translate(-50%,-50%);
  border-radius:50%; display:grid; place-items:center;
  background:linear-gradient(180deg,#7DBE3C,#4E8C1E);
  font-size:22px; line-height:1;
}
.pod.p1 .avatar{ left:11px; width:42px; height:42px; border:4px solid #FDFCF2; }
.pod.p2 .avatar{ left:123px; width:45px; height:45px; border:4px solid #C610A7; }

.kebab{ position:absolute; left:377px; top:18px; width:8px; height:28px; }
.kebab span{
  display:block; width:5px; height:5px; border-radius:50%; background:#fff; margin:0 auto 6px;
}
.kebab span:last-child{ margin-bottom:0; }

/* ---------- Rules ---------- */
.rule-gold{ position:absolute; left:0; top:64px; width:410px; height:4px; background:var(--gold-rule); }
.rule-amber{ position:absolute; left:0; top:68px; width:410px; height:4px; background:var(--amber-shadow); }
.rule-orange{ position:absolute; left:0; top:72px; width:410px; height:14px; background:var(--orange-strip); }

/* ---------- Playfield ---------- */
.playfield{
  position:absolute; left:0; top:87px; width:410px; height:643px; background:var(--blue-field);
}
.frame{
  position:absolute; left:0; top:0; width:410px; height:465px; border-radius:18px;
  background:var(--cyan-rim);
  box-shadow: inset 0 2px 0 var(--cyan-rim-hi), inset 0 -8px 12px rgba(3,60,86,.55);
}
.frame::after{
  content:""; position:absolute; left:6px; top:6px; right:6px; bottom:6px; border-radius:14px;
  box-shadow: inset 0 0 0 6px var(--teal-inset);
  pointer-events:none;
}

/* ---------- Scorecard ---------- */
.scorecard{
  position:absolute; left:16px; top:12px; width:381px; height:467px; border-radius:16px;
  background:var(--card-hi);
  border:3px solid var(--card-border);
  box-shadow: inset 0 0 0 1px var(--card-hi), inset 0 -1px 0 var(--card-border-lo);
  overflow:hidden;
}
.row-band{ position:absolute; left:0; width:381px; height:66.5px; }
.groove{ position:absolute; left:0; width:381px; height:2px; }
.groove .d{ height:1px; background:var(--groove-dark); }
.groove .l{ height:1px; background:var(--groove-light); }

.col-rule{ position:absolute; top:0; width:1px; height:467px; background:rgba(200,145,80,.45); }
.center-divider{ position:absolute; top:0; width:3px; height:467px; background:var(--divider);
  box-shadow: -1px 0 0 #F7D189, 1px 0 0 #F7D189; }

.cat-icon{
  position:absolute; width:48px; height:48px; border-radius:12px;
  background:linear-gradient(180deg,var(--icon-red-top),var(--icon-red-bot));
  box-shadow: 0 0 0 2px #fff, inset 0 2px 0 rgba(255,255,255,.45), 0 2px 0 var(--icon-red-edge), 0 3px 4px rgba(0,0,0,.25);
  display:grid; place-items:center;
}
.cat-icon.wide{ width:49px; }

.score-box{
  position:absolute; width:48px; height:47px; border-radius:9px;
  background:linear-gradient(180deg,var(--box-top),var(--box-bot));
  border:2px solid var(--box-border);
  box-shadow: inset 0 3px 4px var(--box-inner-shadow), inset 0 -1px 0 rgba(255,255,255,.7);
  display:grid; place-items:center;
}
.score-box .num{
  font:800 24px/1 "Baloo 2",sans-serif; color:var(--ink);
  text-shadow: 0 1px 0 rgba(255,255,255,.55);
}

.opp-num{
  position:absolute; width:68px; height:47px; text-align:right;
  font:800 24px/47px "Baloo 2",sans-serif; color:var(--ink);
  text-shadow: 0 1px 0 rgba(255,255,255,.55);
}
.opp-num.previewable{ cursor:pointer; }
.opp-num.previewable:active{ filter:brightness(1.06); transform:translateY(-1px); }
.opp-num .ghost-text{ color:var(--ink-ghost); }

.num.ghost{ color:var(--ink-ghost); }
.score-box.previewable{ cursor:pointer; }
.score-box.previewable:active{ filter:brightness(1.06); transform:translateY(-1px); }
.score-box.selected{
  box-shadow: 0 0 0 3px var(--die-hold), inset 0 3px 4px var(--box-inner-shadow), inset 0 -1px 0 rgba(255,255,255,.7);
  animation: selectedRingPulse 1s ease-in-out infinite;
}
@keyframes selectedRingPulse{
  0%,100%{ box-shadow: 0 0 0 3px var(--die-hold), inset 0 3px 4px var(--box-inner-shadow), inset 0 -1px 0 rgba(255,255,255,.7); }
  50%{ box-shadow: 0 0 0 5px var(--die-hold), inset 0 3px 4px var(--box-inner-shadow), inset 0 -1px 0 rgba(255,255,255,.7); }
}

/* score-commit: flash + bounce + row shimmer (spec 10.2) */
@keyframes boxFlash{
  0%{ background:linear-gradient(180deg,var(--box-top),var(--box-bot)); }
  25%{ background:#FFF9E6; }
  100%{ background:linear-gradient(180deg,var(--box-top),var(--box-bot)); }
}
.score-box.flash{ animation: boxFlash .5s ease-out 1; }
@keyframes numBounce{
  0%{ transform:scale(1); } 30%{ transform:scale(1.7); } 65%{ transform:scale(.92); } 100%{ transform:scale(1); }
}
.num.bounce{ display:inline-block; animation: numBounce .34s cubic-bezier(.34,1.56,.64,1) 1; }
.opp-num .num.bounce{ display:inline-block; }
.row-band.shimmer::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.6) 50%, transparent 70%);
  background-size:250% 100%; background-position:150% 0;
  animation: shimmerSweep .5s ease-out 1;
}
@keyframes shimmerSweep{ from{ background-position:150% 0; } to{ background-position:-50% 0; } }

.cat-icon.pulse-gold{ animation: iconPulseGold .9s ease-in-out 2; }
@keyframes iconPulseGold{
  0%,100%{ box-shadow: 0 0 0 2px #fff, inset 0 2px 0 rgba(255,255,255,.45), 0 2px 0 var(--icon-red-edge), 0 3px 4px rgba(0,0,0,.25); }
  50%{ box-shadow: 0 0 0 4px var(--yahtzee-gold), 0 0 16px 4px rgba(255,201,60,.7), inset 0 2px 0 rgba(255,255,255,.45), 0 2px 0 var(--icon-red-edge), 0 3px 4px rgba(0,0,0,.25); }
}

/* turn change: pod cross-fade (background-color transition already on .pod) + incoming pulse */
@keyframes podPulse{ 0%{ transform:scale(1); } 45%{ transform:scale(1.06); } 100%{ transform:scale(1); } }
.pod.pulse{ animation: podPulse .25s ease-out 1; }

/* pip icon */
.pips{ position:relative; width:48px; height:48px; }
.pips i{ position:absolute; width:8px; height:8px; border-radius:50%; background:var(--icon-white); transform:translate(-50%,-50%); }
.p-tl{ left:14px; top:14px; } .p-tr{ left:34px; top:14px; }
.p-ml{ left:14px; top:24px; } .p-mr{ left:34px; top:24px; }
.p-bl{ left:14px; top:34px; } .p-br{ left:34px; top:34px; }
.p-c{ left:24px; top:24px; }

.xn{ color:#fff; font:800 26px/1 "Baloo 2",sans-serif; font-style:italic; letter-spacing:-1px; }
.xn small{ font-size:19px; }

.house{
  width:30px; height:28px;
  background:#fff;
  clip-path: polygon(50% 0%, 100% 42%, 86% 42%, 86% 100%, 14% 100%, 14% 42%, 0% 42%);
  position:relative;
}
.house::after{
  content:""; position:absolute; left:39%; top:58%; width:22%; height:42%; background:var(--icon-red-bot);
  border-radius:2px 2px 0 0;
}

.straight-fan{ position:relative; width:44px; height:34px; }
.straight-fan .card{
  position:absolute; width:13px; height:18px; background:#fff; border-radius:3px; top:0; left:15.5px;
}
.straight-fan .card:nth-child(1){ transform:translateX(-11px) rotate(-16deg); }
.straight-fan .card:nth-child(2){ transform:rotate(0deg); }
.straight-fan .card:nth-child(3){ transform:translateX(11px) rotate(16deg); }
.straight-fan .banner{
  position:absolute; left:50%; bottom:-2px; transform:translateX(-50%);
  width:34px; height:12px; background:#fff; border-radius:6px;
  display:grid; place-items:center;
  font:800 9px/1 "Baloo 2",sans-serif; color:#D42E2E; letter-spacing:.5px;
}

.yahtzee-word{
  font:14px "Luckiest Guy",cursive; color:var(--yahtzee-gold);
  -webkit-text-stroke:2.5px #8B1A00; paint-order:stroke fill;
  transform:skewX(-8deg);
}

.chance-q{ color:#fff; font:800 30px/1 "Baloo 2",sans-serif; }

/* sparkles */
.sparkle{ position:absolute; width:9px; height:9px; color:#fff; animation:twinkle 1.8s ease-in-out infinite; }
@keyframes twinkle{ 0%,100%{ opacity:.3; transform:scale(.7);} 50%{ opacity:1; transform:scale(1);} }

/* ---------- Dice tray: real CSS 3D cubes ---------- */
.die{ position:absolute; width:56px; height:56px; top:591px; perspective:600px; }
.die-shadow{
  position:absolute; left:5px; bottom:-8px; width:46px; height:10px; border-radius:50%;
  background:rgba(0,20,50,.4); filter:blur(2px); transition: transform .18s, opacity .18s, filter .18s;
}
.die .cube{
  position:relative; width:56px; height:56px; transform-style:preserve-3d;
  transform: rotateX(0deg) rotateY(0deg);
}
.face{
  position:absolute; inset:0; width:56px; height:56px; border-radius:11px; backface-visibility:hidden;
  background:linear-gradient(160deg,#FFFFFF 0%, #FFFFFF 45%, var(--die-bot) 100%);
  border:1px solid var(--die-edge);
  box-shadow: inset 0 2px 0 #fff;
}
.face .pip{ position:absolute; width:9px; height:9px; border-radius:50%; background:var(--pip); }
.face.f1{ transform: translateZ(28px); }
.face.f6{ transform: rotateY(180deg) translateZ(28px); }
.face.f2{ transform: rotateX(90deg) translateZ(28px); }
.face.f5{ transform: rotateX(-90deg) translateZ(28px); }
.face.f3{ transform: rotateY(90deg) translateZ(28px); }
.face.f4{ transform: rotateY(-90deg) translateZ(28px); }

.die{ transition: transform .14s ease-out; }
.die.held{ transform: translateY(-10px); }
.die.held .cube .face{ box-shadow: inset 0 2px 0 #fff, 0 0 0 3px var(--die-hold), 0 0 10px 3px rgba(255,213,74,.55); }

/* ---------- Buttons ---------- */
.roll-btn{
  position:absolute; left:10px; top:664px; width:257px; height:59px; border-radius:16px;
  background:linear-gradient(180deg,#0A88C4 0%, #0A88C4 5%, #9BF2FA 9%, #56FEF9 22%, #33FEFE 42%, #04D5F2 72%, #027BAD 92%, #012B4B 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 4px 0 var(--roll-lip), 0 5px 6px rgba(0,0,0,.28);
  border:none; padding:0;
}
.roll-btn{ transition: transform 60ms, box-shadow 60ms; }
.roll-btn.disabled{ filter:saturate(.55); box-shadow:none; cursor:not-allowed; }
.roll-btn:active:not(.disabled){ transform:translateY(3px); box-shadow:none; }
.roll-btn .label{
  position:absolute; left:28px; top:50%; transform:translateY(-50%);
  font:800 26px/1 "Baloo 2",sans-serif; color:#fff;
  -webkit-text-stroke:4px #05496E; paint-order:stroke fill;
}
.roll-pip{
  position:absolute; top:676px; width:22px; height:22px; border-radius:6px;
  display:grid; place-items:center; font:800 14px/1 "Baloo 2",sans-serif;
}
.roll-pip.lit{ background:#fff; box-shadow: inset 0 -2px 0 #B9CEDB; color:#0A5A84; }
.roll-pip.dim{ background:rgba(1,60,95,.35); color:rgba(255,255,255,.3); }

.play-btn{
  position:absolute; left:279px; top:672px; width:126px; height:51px; border-radius:16px;
  border:none; padding:0; transition: transform 60ms, box-shadow 60ms;
}
.play-btn.off{
  background:linear-gradient(180deg,var(--play-off-a),var(--play-off-b));
  box-shadow: 0 5px 6px rgba(0,0,0,.28);
  cursor:not-allowed;
}
.play-btn.off .label{ color:var(--play-off-text); font:800 22px/1 "Baloo 2",sans-serif; }
.play-btn.on{
  background:linear-gradient(180deg,var(--play-on-a),var(--play-on-b));
  box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 4px 0 var(--play-lip), 0 5px 6px rgba(0,0,0,.28);
  animation: playPulse 1.6s ease-in-out infinite;
}
.play-btn.on:active{ transform:translateY(3px); box-shadow:none; animation:none; }
.play-btn.on .label{ color:#fff; -webkit-text-stroke:3px #234E08; paint-order:stroke fill; font:800 22px/1 "Baloo 2",sans-serif; }
@keyframes playPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.04);} }
.play-btn .label{ position:absolute; inset:0; display:grid; place-items:center; }

/* ---------- Overlay / toast / celebration (spec 10.3 set piece) ---------- */
#toast{
  position:absolute; left:50%; top:16px; transform:translateX(-50%); opacity:0; pointer-events:none;
  background:rgba(0,0,0,.6); color:var(--yahtzee-gold); font:800 15px "Baloo 2",sans-serif;
  padding:6px 14px; border-radius:10px; transition:opacity .3s, transform .3s; z-index:60; white-space:nowrap;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(8px); }

#celebration{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:55; }
#cel-flash{ position:absolute; inset:0; background:#fff; opacity:0; }
#cel-flash.play{ animation: celFlash .14s ease-out 1; }
@keyframes celFlash{ 0%{opacity:0;} 40%{opacity:.38;} 100%{opacity:0;} }

#cel-rays{
  position:absolute; left:205px; top:300px; width:560px; height:560px; margin:-280px 0 0 -280px;
  background: repeating-conic-gradient(from 0deg, #FFE680 0deg 3deg, transparent 3deg 22.5deg);
  border-radius:50%; opacity:0;
}
#cel-rays.play{ animation: celRays 2.6s linear 1; }
@keyframes celRays{
  0%{ transform:rotate(0deg) scale(.3); opacity:0; }
  15%{ opacity:.85; }
  85%{ opacity:.85; }
  100%{ transform:rotate(360deg) scale(1.9); opacity:0; }
}

#cel-text{
  position:absolute; left:205px; top:300px; transform:translate(-50%,-50%) scale(.15) rotate(-20deg);
  font:62px "Luckiest Guy",cursive; white-space:nowrap;
  background:linear-gradient(180deg,#FFF2B0,#FFC400,#FF8A00);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  -webkit-text-stroke:7px #8B1A00; paint-order:stroke fill;
  filter: drop-shadow(0 6px 0 #6B1200) drop-shadow(0 10px 14px rgba(0,0,0,.5));
  opacity:0;
}
#cel-text.play{ animation: celText 2.6s cubic-bezier(.34,1.56,.64,1) 1; }
@keyframes celText{
  0%{ transform:translate(-50%,-50%) scale(.15) rotate(-20deg); opacity:0; }
  28%{ transform:translate(-50%,-50%) scale(1.32) rotate(7deg); opacity:1; }
  40%{ transform:translate(-50%,-50%) scale(.93) rotate(-4deg); opacity:1; }
  52%{ transform:translate(-50%,-50%) scale(1.09) rotate(2deg); opacity:1; }
  62%{ transform:translate(-50%,-50%) scale(1) rotate(0deg); opacity:1; }
  88%{ transform:translate(-50%,-50%) scale(1) rotate(0deg); opacity:1; }
  100%{ transform:translate(-50%,-50%) scale(1.15) translateY(-38px) rotate(0deg); opacity:0; }
}

#cel-confetti{ position:absolute; inset:0; }
.confetti-piece{ position:absolute; left:205px; top:300px; will-change:transform,opacity; }

@media (prefers-reduced-motion: reduce){
  #cel-rays.play{ animation-duration:.05s; }
  #cel-text.play{ animation-duration:.2s; }
  #cel-flash.play{ animation-duration:.05s; }
}

#overlay{
  position:absolute; inset:0; display:none; place-items:center; background:rgba(0,0,0,.55); z-index:50;
}
#overlay.show{ display:grid; }
.overlay-card{
  background:var(--orange-strip); border:4px solid var(--gold-rule); border-radius:20px;
  padding:26px 30px; text-align:center; color:#5C2E00; font:800 18px "Baloo 2",sans-serif; max-width:320px;
}
.overlay-title{ font-size:26px; margin-bottom:14px; }
.overlay-scores{ margin-bottom:18px; font-weight:700; line-height:1.6; }
.overlay-card .play-btn{ position:static; display:inline-block; }

@media (prefers-reduced-motion: reduce){
  .sparkle, .play-btn.on, .score-box.selected{ animation-duration:.01s; }
  .die, .die .cube{ transition-duration:.02s; }
}
</style>
</head>
<body>
<div id="fit">
<div id="shakeWrap">
<div id="stage">

  <div class="hdr">
    <svg class="chevron abs" viewBox="0 0 12 20"><path d="M10 2 L2 10 L10 18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <div class="pod p1 active" id="pod1">
      <div class="avatar" id="p1avatar">&#128578;</div>
      <div class="pod-total" id="p1total">105</div>
      <div class="pod-name" id="p1name">FabulousR&hellip;</div>
    </div>

    <div class="pod p2 idle" id="pod2">
      <div class="pod-total" id="p2total">67</div>
      <div class="pod-name" id="p2name">Turtle</div>
      <div class="avatar" id="p2avatar">&#128034;</div>
    </div>

    <div class="kebab abs"><span></span><span></span><span></span></div>
  </div>

  <div class="rule-gold"></div>
  <div class="rule-amber"></div>
  <div class="rule-orange"></div>

  <div class="playfield">
    <div class="frame"></div>
    <div class="scorecard" id="scorecard"></div>
  </div>

  <!-- Dice: real static 6-face CSS cubes; JS rotates each cube to show the current value -->
  <div class="die" id="dieWrap0" style="left:19px"><div class="die-shadow"></div><div class="cube" id="cube0"></div></div>
  <div class="die" id="dieWrap1" style="left:98px"><div class="die-shadow"></div><div class="cube" id="cube1"></div></div>
  <div class="die" id="dieWrap2" style="left:177px"><div class="die-shadow"></div><div class="cube" id="cube2"></div></div>
  <div class="die" id="dieWrap3" style="left:256px"><div class="die-shadow"></div><div class="cube" id="cube3"></div></div>
  <div class="die" id="dieWrap4" style="left:335px"><div class="die-shadow"></div><div class="cube" id="cube4"></div></div>

  <button class="roll-btn" id="rollBtn"><span class="label">ROLL</span></button>
  <div class="roll-pip lit" id="rollPip1" style="left:178px">1</div>
  <div class="roll-pip lit" id="rollPip2" style="left:208px">2</div>
  <div class="roll-pip dim" id="rollPip3" style="left:238px">3</div>
  <button class="play-btn off" id="playBtn"><span class="label">PLAY</span></button>

  <div id="toast"></div>
  <div id="celebration">
    <div id="cel-flash"></div>
    <div id="cel-rays"></div>
    <div id="cel-text">YAHTZEE!!</div>
    <div id="cel-confetti"></div>
  </div>
  <div id="overlay"></div>

</div>
</div>
</div>

<script>
'use strict';
const DEBUG_REFERENCE = false;
const MODE = 'ai'; // 'ai' | 'hotseat'

/* ---------- STATE ---------- */
const UPPER_KEYS = ['ones','twos','threes','fours','fives','sixes'];
const LEFT_CATS = UPPER_KEYS;
const RIGHT_CATS = ['threeKind','fourKind','fullHouse','smallStraight','largeStraight','yahtzee','chance'];
const CATEGORIES = [...LEFT_CATS, ...RIGHT_CATS];
const RIGHT_ICON_KIND = {
  threeKind:'3x', fourKind:'4x', fullHouse:'house',
  smallStraight:'small', largeStraight:'large', yahtzee:'yahtzee', chance:'chance'
};

let state = null;

function newGame(){
  state = {
    players: [
      { name:'You', scores:{}, bonusTotal:0 },
      { name: MODE==='ai' ? 'Computer' : 'Player 2', scores:{}, bonusTotal:0 }
    ],
    current: 0,
    dice: [0,0,0,0,0].map(()=>({ value:1, held:false })),
    rollsUsed: 0,
    selected: null,
    phase: 'idle',
    yahtzeeBonusCount: [0,0],
    gameOver: false
  };
}

/* ---------- SCORING ---------- */
function sum(arr){ return arr.reduce((a,b)=>a+b,0); }
function counts(vals){ const c={}; vals.forEach(v=>{ c[v]=(c[v]||0)+1; }); return c; }
function diceValues(dice){ return dice.map(d=>d.value); }
function isYahtzeeRoll(dice){ return Object.values(counts(diceValues(dice))).some(n=>n===5); }

function categoryScore(cat, dice){
  const vals = diceValues(dice);
  const c = counts(vals);
  const upperIdx = UPPER_KEYS.indexOf(cat);
  if(upperIdx>=0){
    const face = upperIdx+1;
    return vals.filter(v=>v===face).length*face;
  }
  switch(cat){
    case 'threeKind': return Object.values(c).some(n=>n>=3) ? sum(vals) : 0;
    case 'fourKind':  return Object.values(c).some(n=>n>=4) ? sum(vals) : 0;
    case 'fullHouse': {
      const cs = Object.values(c).sort((a,b)=>a-b);
      return (cs.length===2 && cs[0]===2 && cs[1]===3) ? 25 : 0;
    }
    case 'smallStraight': {
      const set = new Set(vals);
      const runs = [[1,2,3,4],[2,3,4,5],[3,4,5,6]];
      return runs.some(r=>r.every(v=>set.has(v))) ? 30 : 0;
    }
    case 'largeStraight': {
      const key = [...new Set(vals)].sort((a,b)=>a-b).join(',');
      return (key==='1,2,3,4,5' || key==='2,3,4,5,6') ? 40 : 0;
    }
    case 'yahtzee': return Object.values(c).some(n=>n===5) ? 50 : 0;
    case 'chance':  return sum(vals);
  }
  return 0;
}

// Applies the joker rule on top of categoryScore when the current roll is a
// Yahtzee and the player's yahtzee box already holds 50 (a bonus situation).
function previewScore(playerScores, cat, dice){
  const vals = diceValues(dice);
  const isYz = isYahtzeeRoll(dice);
  const yzBoxUsed = playerScores.yahtzee === 50;
  if(isYz && yzBoxUsed && cat!=='yahtzee'){
    const face = vals[0];
    const upperKey = UPPER_KEYS[face-1];
    if(cat === upperKey) return face*5;
    if(cat === 'fullHouse') return 25;
    if(cat === 'smallStraight') return 30;
    if(cat === 'largeStraight') return 40;
    if(cat === 'threeKind' || cat === 'fourKind' || cat === 'chance') return sum(vals);
    if(UPPER_KEYS.includes(cat)) return 0; // non-matching upper box, joker fallback
  }
  return categoryScore(cat, dice);
}

// Which categories the current roll may legally be committed to. Enforces
// the joker rule's "matching upper box first" constraint.
function availableCategories(playerScores, dice){
  const open = CATEGORIES.filter(c=>playerScores[c]==null);
  const isYz = isYahtzeeRoll(dice);
  const yzBoxUsed = playerScores.yahtzee === 50;
  if(isYz && yzBoxUsed){
    const face = diceValues(dice)[0];
    const upperKey = UPPER_KEYS[face-1];
    if(playerScores[upperKey]==null) return [upperKey];
  }
  return open;
}

function upperSum(scores){ return UPPER_KEYS.reduce((s,k)=>s+(scores[k]||0),0); }
function upperBonus(scores){ return upperSum(scores) >= 63 ? 35 : 0; }
function totalScore(p){
  const filled = CATEGORIES.reduce((s,c)=>s+(p.scores[c]||0),0);
  return filled + upperBonus(p.scores) + (p.bonusTotal||0);
}
function isGameOver(){
  return state.players.every(p => CATEGORIES.every(c => p.scores[c]!=null));
}

/* ---------- TURN / COMMIT FLOW ---------- */
function isHumanTurn(){ return MODE==='hotseat' || state.current===0; }
function reducedMotion(){
  return typeof window.matchMedia==='function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

async function doRoll(){
  if(state.phase==='gameOver' || state.rollsUsed>=3) return;
  const heldMask = state.dice.map(d=>d.held);
  state.dice.forEach(d=>{ if(!d.held) d.value = 1+Math.floor(Math.random()*6); });
  state.rollsUsed++;
  state.selected = null;
  state.phase = 'rolling';
  renderHeader(); renderScorecard(); renderControls(); renderOverlay();
  await animateRoll(heldMask);
  state.phase = 'awaitingPick';
  renderScorecard(); // ghost previews now that rollsUsed>=1
  renderControls();
}

function toggleHold(i){
  if(state.rollsUsed<1 || state.rollsUsed>=3 || state.phase==='gameOver') return;
  state.dice[i].held = !state.dice[i].held;
  render();
  const liftY = state.dice[i].held ? -10 : 0;
  const dieEl = document.getElementById('dieWrap'+i);
  const dur = reducedMotion() ? 20 : 140;
  dieEl.animate([
    { transform:`translateY(${liftY}px) rotate(0deg)` },
    { transform:`translateY(${liftY}px) rotate(3deg)` },
    { transform:`translateY(${liftY}px) rotate(-3deg)` },
    { transform:`translateY(${liftY}px) rotate(0deg)` }
  ], { duration:dur, easing:'ease-out' });
}

function selectCategory(cat){
  if(state.rollsUsed<1 || state.phase==='gameOver') return;
  const avail = availableCategories(state.players[state.current].scores, state.dice);
  if(!avail.includes(cat)) return;
  state.selected = cat;
  render();
}

function commitSelection(){
  if(state.phase==='gameOver' || !state.selected) return;
  const cat = state.selected;
  const committedPlayer = state.current;
  const p = state.players[committedPlayer];
  const dice = state.dice;
  const value = previewScore(p.scores, cat, dice);
  const isYz = isYahtzeeRoll(dice);
  const wasBonus = isYz && p.scores.yahtzee === 50;
  const bonusBefore = upperBonus(p.scores);
  const beforeTotals = [totalScore(state.players[0]), totalScore(state.players[1])];

  p.scores[cat] = value;
  if(wasBonus){
    p.bonusTotal = (p.bonusTotal||0) + 100;
    state.yahtzeeBonusCount[committedPlayer]++;
  }
  const bonusAfter = upperBonus(p.scores);
  const upperBonusFired = bonusAfter > bonusBefore;
  const celebrate = (cat==='yahtzee' && value===50) || wasBonus;
  const afterTotals = [totalScore(state.players[0]), totalScore(state.players[1])];

  endTurn({ celebrate, upperBonusFired, cat, committedPlayer, beforeTotals, afterTotals });
}

function endTurn(effects){
  state.selected = null;
  state.dice.forEach(d=>{ d.held=false; });
  state.rollsUsed = 0;

  const gameOver = isGameOver();
  if(gameOver){
    state.phase = 'gameOver';
    state.gameOver = true;
  } else {
    state.current = 1 - state.current;
    state.phase = 'idle';
  }

  render();
  if(!gameOver){
    const incomingPod = document.getElementById(state.current===0 ? 'pod1' : 'pod2');
    incomingPod.classList.add('pulse');
    setTimeout(()=>incomingPod.classList.remove('pulse'), 300);
  }
  if(effects) animateCommitEffects(effects);

  if(!gameOver && MODE==='ai' && state.current===1){
    setTimeout(aiTakeTurn, 700);
  }
}

/* ---------- AI ---------- */
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

function aiChooseHolds(dice){
  const vals = diceValues(dice);
  const c = counts(vals);
  let bestVal=null, bestCount=0;
  for(const v in c){ if(c[v]>bestCount){ bestCount=c[v]; bestVal=+v; } }
  const uniqueSorted = [...new Set(vals)].sort((a,b)=>a-b);
  const holdVals = new Set();
  for(let i=0;i<=uniqueSorted.length-4;i++){
    if(uniqueSorted[i+3]-uniqueSorted[i]===3){
      for(let k=i;k<i+4;k++) holdVals.add(uniqueSorted[k]);
      break;
    }
  }
  if(holdVals.size===0 && bestCount>=2) holdVals.add(bestVal);
  return holdVals;
}

function pickCategoryForAI(scores, dice){
  const avail = availableCategories(scores, dice);
  let best=null, bestVal=-1;
  for(const cat of avail){
    const v = previewScore(scores, cat, dice) || 0;
    if(best===null || v>bestVal){ best=cat; bestVal=v; continue; }
    if(v===bestVal){
      const catIsLower = !UPPER_KEYS.includes(cat);
      const bestIsLower = !UPPER_KEYS.includes(best);
      if(catIsLower && !bestIsLower){ best=cat; bestVal=v; }
    }
  }
  return best;
}

async function aiTakeTurn(){
  if(state.current!==1 || state.phase==='gameOver') return;
  state.phase = 'rolling';
  while(state.rollsUsed<3){
    await wait(300);
    await doRoll();
    await wait(400);
    if(state.rollsUsed<3){
      const holdVals = aiChooseHolds(state.dice);
      state.dice.forEach(d=>{ d.held = holdVals.has(d.value); });
      render();
    }
  }
  const best = pickCategoryForAI(state.players[1].scores, state.dice);
  state.selected = best;
  render();
  await wait(600);
  commitSelection();
}

/* ---------- FEEDBACK / ANIMATION (spec 10.2, 10.3, 10.4) ---------- */
function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1200);
}

function rowIndexForCategory(cat){
  const li = LEFT_CATS.indexOf(cat);
  if(li>=0) return li+1;
  return RIGHT_CATS.indexOf(cat)+1;
}

function tickerAnimate(idx, from, to){
  if(from===to) return;
  const el = document.getElementById(idx===0 ? 'p1total' : 'p2total');
  const dur = reducedMotion() ? 30 : 450;
  let start = null;
  function step(ts){
    if(start===null) start = ts;
    const t = Math.min(1, (ts-start)/dur);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = Math.round(from + (to-from)*eased);
    if(t<1) requestAnimationFrame(step);
    else el.textContent = to;
  }
  requestAnimationFrame(step);
}

// Score-commit: box flash, numeral bounce, header count-up ticker, row shimmer sweep (spec 10.2).
function animateCommitEffects(effects){
  const { cat, committedPlayer, beforeTotals, afterTotals, upperBonusFired, celebrate } = effects;

  [0,1].forEach(idx => tickerAnimate(idx, beforeTotals[idx], afterTotals[idx]));

  const cell = committedPlayer===0
    ? document.querySelector(`.score-box[data-cat="${cat}"]`)
    : document.querySelector(`.opp-num[data-cat="${cat}"]`);
  if(cell){
    const numEl = cell.querySelector('.num') || cell;
    if(committedPlayer===0) cell.classList.add('flash');
    numEl.classList.add('bounce');
    setTimeout(()=>{ cell.classList.remove('flash'); numEl.classList.remove('bounce'); }, 600);

    const rowIdx = rowIndexForCategory(cat);
    const band = document.querySelectorAll('.row-band')[rowIdx-1];
    if(band){
      band.classList.add('shimmer');
      setTimeout(()=>band.classList.remove('shimmer'), 550);
    }
  }

  if(upperBonusFired) showToast('+35 BONUS!');
  if(celebrate) celebrateYahtzee();
}

function stageShake(){
  const el = document.getElementById('shakeWrap');
  const rm = reducedMotion();
  const dur = rm ? 30 : 380;
  const delay = rm ? 0 : 120;
  el.animate([
    { transform:'translate(0,0)' },
    { transform:'translate(5px,-3px)' },
    { transform:'translate(-5px,3px)' },
    { transform:'translate(4px,-4px)' },
    { transform:'translate(-4px,2px)' },
    { transform:'translate(2px,-2px)' },
    { transform:'translate(0,0)' }
  ], { duration:dur, delay, easing:'ease-in-out' });
}

const CONFETTI_COLORS = ['#FFC93C','#FE4B4B','#10AEEF','#7DBE3C','#FFFFFF','#C610A7'];
function spawnConfetti(){
  const layer = document.getElementById('cel-confetti');
  layer.innerHTML = '';
  const g = 1150; // px/s^2
  const pieces = [];
  for(let i=0;i<70;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 6 + Math.random()*7;
    const rect = Math.random()<0.5;
    el.style.width = size+'px';
    el.style.height = (rect ? size*0.6 : size)+'px';
    el.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    el.style.borderRadius = rect ? '2px' : '50%';
    layer.appendChild(el);
    pieces.push({
      el,
      x:0, y:0,
      vx:(Math.random()*2-1)*340,
      vy:-260 - Math.random()*360,
      rot: Math.random()*360,
      vrot:(Math.random()<0.5?-1:1)*(720*(0.5+Math.random())),
    });
  }
  const total = 2600;
  const start = performance.now();
  function frame(now){
    const t = (now-start)/1000; // seconds
    if(t*1000 > total){ layer.innerHTML=''; return; }
    const fadeStart = (total-500)/1000;
    const opacity = t>fadeStart ? Math.max(0, 1-(t-fadeStart)/0.5) : 1;
    pieces.forEach(p=>{
      const x = p.vx*t;
      const y = p.vy*t + 0.5*g*t*t;
      const rot = p.rot + p.vrot*t;
      p.el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
      p.el.style.opacity = opacity;
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// The YAHTZEE!! celebration set piece (spec 10.3): flash, rotating rays, gradient
// stroked text, 70-piece confetti burst, stage shake. Fires on every Yahtzee commit
// (first or bonus). Also pulses the Yahtzee category icon gold.
function celebrateYahtzee(){
  const rm = reducedMotion();
  const flash = document.getElementById('cel-flash');
  const rays = document.getElementById('cel-rays');
  const text = document.getElementById('cel-text');
  [flash, rays, text].forEach(el=>{ el.classList.remove('play'); void el.offsetWidth; el.classList.add('play'); });

  if(!rm) spawnConfetti();
  stageShake();

  const icon = document.querySelector('.cat-icon[data-cat="yahtzee"]');
  if(icon){
    icon.classList.remove('pulse-gold'); void icon.offsetWidth; icon.classList.add('pulse-gold');
    setTimeout(()=>icon.classList.remove('pulse-gold'), 1900);
  }

  const total = rm ? 300 : 2600;
  setTimeout(()=>{ [flash, rays, text].forEach(el=>el.classList.remove('play')); }, total+50);
}

/* ---------- Dice: real CSS 3D cubes ---------- */
const FACE_ROT = {
  1:{x:0,y:0}, 2:{x:-90,y:0}, 3:{x:0,y:-90}, 4:{x:0,y:90}, 5:{x:90,y:0}, 6:{x:0,y:180}
};

function buildDiceCubes(){
  for(let i=0;i<5;i++){
    const cube = document.getElementById('cube'+i);
    let html = '';
    for(let f=1; f<=6; f++){
      html += `<div class="face f${f}">${pipFaceHTML(f)}</div>`;
    }
    cube.innerHTML = html;
    setDieFace(i, 1, true);
  }
}

function setDieFace(i, value, instant){
  const cube = document.getElementById('cube'+i);
  const rot = FACE_ROT[value];
  if(instant){
    cube.style.transition = 'none';
    cube.style.transform = `rotateX(${rot.x}deg) rotateY(${rot.y}deg)`;
    void cube.offsetWidth;
    cube.style.transition = '';
  } else {
    cube.style.transform = `rotateX(${rot.x}deg) rotateY(${rot.y}deg)`;
  }
}

// Real 3D tumble per spec 10.1: launch, tumble (extra full spins + wobble + arc),
// drop (overshoot), squash. Held dice never spin. Staggered 55ms across dice index.
function animateRoll(heldMaskBefore){
  const rm = reducedMotion();
  const stagger = rm ? 5 : 55;
  const totalDur = rm ? 90 : 860;
  const promises = [];
  let lastLandAt = 0;

  state.dice.forEach((d,i)=>{
    if(heldMaskBefore[i]) return; // held dice don't animate/spin
    const delay = i*stagger;
    lastLandAt = Math.max(lastLandAt, delay+totalDur);

    const cube = document.getElementById('cube'+i);
    const dieEl = document.getElementById('dieWrap'+i);
    const shadow = dieEl.querySelector('.die-shadow');
    const rot = FACE_ROT[d.value];
    const extraX = 360*(2+Math.floor(Math.random()*2));
    const extraY = 360*(2+Math.floor(Math.random()*2));
    const wobble = (Math.random()*14-7);

    promises.push(new Promise(resolve=>{
      setTimeout(()=>{
        cube.style.transition = rm ? `transform ${totalDur*0.9}ms linear` : 'transform .72s cubic-bezier(.22,.8,.24,1)';
        cube.style.transform = `rotateX(${extraX+rot.x}deg) rotateY(${extraY+rot.y}deg)`;
        if(shadow) shadow.animate([
          { transform:'scale(1)', opacity:.4 },
          { transform:'scale(.55)', opacity:.22, offset:.5 },
          { transform:'scale(1)', opacity:.4 }
        ], { duration: totalDur, easing:'ease-out' });

        const anim = dieEl.animate([
          { transform:'translateY(0) scale(1)', offset:0 },
          { transform:'translateY(-22px) scale(1.14)', offset:0.105 },
          { transform:`translateY(-34px) translateX(${wobble}px) scale(1.14)`, offset:0.45 },
          { transform:'translateY(0) scale(1)', offset:0.907 },
          { transform:'scaleY(.86) scaleX(1.08)', offset:0.94 },
          { transform:'scale(1)', offset:1 }
        ], { duration: totalDur, easing:'cubic-bezier(.34,1.56,.64,1)' });

        anim.onfinish = ()=>{ cube.style.transition=''; resolve(); };
      }, delay);
    }));
  });

  if(promises.length){
    setTimeout(trayShake, Math.max(0, lastLandAt-60));
  }
  return Promise.all(promises);
}

function trayShake(){
  const rm = reducedMotion();
  const dur = rm ? 20 : 180;
  state.dice.forEach((d,i)=>{
    const liftY = d.held ? -10 : 0;
    const el = document.getElementById('dieWrap'+i);
    el.animate([
      { transform:`translate(0px, ${liftY}px)` },
      { transform:`translate(-2px, ${liftY}px)` },
      { transform:`translate(2px, ${liftY}px)` },
      { transform:`translate(0px, ${liftY}px)` }
    ], { duration:dur, easing:'ease-out' });
  });
}

/* ---------- RENDER ---------- */
function pipIcon(n){
  const map = {
    1:['p-c'], 2:['p-tl','p-br'], 3:['p-tl','p-c','p-br'],
    4:['p-tl','p-tr','p-bl','p-br'], 5:['p-tl','p-tr','p-c','p-bl','p-br'],
    6:['p-tl','p-tr','p-ml','p-mr','p-bl','p-br']
  };
  return `<div class="pips">${map[n].map(c=>`<i class="${c}"></i>`).join('')}</div>`;
}

const UPPER_LABELS = ['Ones','Twos','Threes','Fours','Fives','Sixes'];

function renderReferenceCard(){
  const card = document.getElementById('scorecard');
  const rowH = 66.5;
  const rowTop = i => (i-1)*rowH;

  // row bands + grooves
  let html = '';
  for(let i=1;i<=7;i++){
    const bg = (i % 2 === 1) ? 'var(--row-a)' : 'var(--row-b)';
    html += `<div class="row-band" style="top:${rowTop(i)}px;background:${bg}"></div>`;
  }
  for(let i=1;i<=6;i++){
    const y = rowTop(i+1) - 2;
    html += `<div class="groove" style="top:${y}px"><div class="d"></div><div class="l"></div></div>`;
  }

  // dividers
  html += `<div class="col-rule" style="left:118px"></div>`;
  html += `<div class="col-rule" style="left:307px"></div>`;
  html += `<div class="center-divider" style="left:190px"></div>`;

  // reference data
  const left = [
    { label:'Ones',   box:null, opp:4  },
    { label:'Twos',   box:8,    opp:null },
    { label:'Threes', box:null, opp:null },
    { label:'Fours',  box:null, opp:12 },
    { label:'Fives',  box:15,   opp:10 },
    { label:'Sixes',  box:null, opp:null }
  ];
  const right = [
    { kind:'3x',      box:14, opp:18 },
    { kind:'4x',      box:28, opp:null },
    { kind:'house',   box:null, opp:0 },
    { kind:'small',   box:null, opp:null },
    { kind:'large',   box:40, opp:null },
    { kind:'yahtzee', box:null, opp:null },
    { kind:'chance',  box:null, opp:23 }
  ];

  left.forEach((row,idx)=>{
    const i = idx+1;
    const iconTop = rowTop(i) + 9.25;
    const boxTop = rowTop(i) + 9.75;
    html += `<div class="cat-icon abs" style="left:7px;top:${iconTop}px">${pipIcon(i)}</div>`;
    html += `<div class="score-box abs" style="left:69px;top:${boxTop}px">${row.box!=null?`<span class="num">${row.box}</span>`:''}</div>`;
    if(row.opp!=null){
      html += `<div class="opp-num abs" style="left:120px;top:${boxTop}px">${row.opp}</div>`;
    }
  });

  right.forEach((row,idx)=>{
    const i = idx+1;
    const iconTop = rowTop(i) + 9.25;
    const boxTop = rowTop(i) + 9.75;
    html += `<div class="cat-icon wide abs" style="left:196px;top:${iconTop}px">${rightIcon(row.kind)}</div>`;
    html += `<div class="score-box abs" style="left:258px;top:${boxTop}px">${row.box!=null?`<span class="num">${row.box}</span>`:''}</div>`;
    if(row.opp!=null){
      html += `<div class="opp-num abs" style="left:309px;top:${boxTop}px">${row.opp}</div>`;
    }
  });

  // sparkles (near Large Straight row): stage (363,383) & (404,372) -> card-relative minus (16,12)
  html += sparkleSVG(363-16, 383-12);
  html += sparkleSVG(404-16, 372-12);

  card.innerHTML = html;
}

function sparkleSVG(x,y){
  return `<svg class="sparkle abs" style="left:${x}px;top:${y}px" viewBox="0 0 9 9">
    <path d="M4.5 0 L5.6 3.4 L9 4.5 L5.6 5.6 L4.5 9 L3.4 5.6 L0 4.5 L3.4 3.4 Z" fill="#fff"/>
  </svg>`;
}

function rightIcon(kind){
  switch(kind){
    case '3x': return `<span class="xn">3<small>x</small></span>`;
    case '4x': return `<span class="xn">4<small>x</small></span>`;
    case 'house': return `<div class="house"></div>`;
    case 'small': return `<div class="straight-fan"><div class="card"></div><div class="card"></div><div class="card"></div><div class="banner">SMALL</div></div>`;
    case 'large': return `<div class="straight-fan"><div class="card"></div><div class="card"></div><div class="card"></div><div class="banner">LARGE</div></div>`;
    case 'yahtzee': return `<span class="yahtzee-word">Yahtzee</span>`;
    case 'chance': return `<span class="chance-q">?</span>`;
  }
  return '';
}

function renderReferenceDice(){
  const faces = [5,6,3,6,6];
  faces.forEach((v,i)=> setDieFace(i, v, true));
}
function pipFaceHTML(n){
  const positions = {
    1:[[28,28]],
    2:[[15,15],[41,41]],
    3:[[15,15],[28,28],[41,41]],
    4:[[15,15],[41,15],[15,41],[41,41]],
    5:[[15,15],[41,15],[28,28],[15,41],[41,41]],
    6:[[15,15],[41,15],[15,28],[41,28],[15,41],[41,41]]
  };
  return positions[n].map(([x,y])=>`<div class="pip" style="left:${x-4.5}px;top:${y-4.5}px"></div>`).join('');
}

/* ---------- Live render (Phase 2: the real, playable game) ---------- */
function render(){
  renderHeader();
  renderScorecard();
  renderDice();
  renderControls();
  renderOverlay();
}

function renderHeader(){
  const p1 = state.players[0], p2 = state.players[1];
  document.getElementById('p1total').textContent = totalScore(p1);
  document.getElementById('p2total').textContent = totalScore(p2);
  document.getElementById('p1name').textContent = p1.name;
  document.getElementById('p2name').textContent = p2.name;

  const pod1 = document.getElementById('pod1'), pod2 = document.getElementById('pod2');
  pod1.classList.toggle('active', state.current===0);
  pod1.classList.toggle('idle', state.current!==0);
  pod2.classList.toggle('active', state.current===1);
  pod2.classList.toggle('idle', state.current!==1);

  const myEmoji = readProfileEmoji();
  document.getElementById('p1avatar').textContent = myEmoji || '\u{1F642}';
  document.getElementById('p2avatar').textContent = '\u{1F916}';
}

function renderScorecard(){
  const card = document.getElementById('scorecard');
  const rowH = 66.5;
  const rowTop = i => (i-1)*rowH;

  let html = '';
  for(let i=1;i<=7;i++){
    const bg = (i % 2 === 1) ? 'var(--row-a)' : 'var(--row-b)';
    html += `<div class="row-band" style="top:${rowTop(i)}px;background:${bg}"></div>`;
  }
  for(let i=1;i<=6;i++){
    const y = rowTop(i+1) - 2;
    html += `<div class="groove" style="top:${y}px"><div class="d"></div><div class="l"></div></div>`;
  }
  html += `<div class="col-rule" style="left:118px"></div>`;
  html += `<div class="col-rule" style="left:307px"></div>`;
  html += `<div class="center-divider" style="left:190px"></div>`;

  const p1 = state.players[0], p2 = state.players[1];
  const activeIdx = state.current;
  const activeScores = state.players[activeIdx].scores;
  const canPreview = state.rollsUsed>=1 && state.phase!=='gameOver';
  const avail = canPreview ? availableCategories(activeScores, state.dice) : [];

  function cell(cat, iconHTML, iconLeft, wide, boxLeft, oppLeft, i){
    const iconTop = rowTop(i) + 9.25;
    const boxTop = rowTop(i) + 9.75;
    let out = `<div class="cat-icon ${wide?'wide':''} abs" data-cat="${cat}" style="left:${iconLeft}px;top:${iconTop}px">${iconHTML}</div>`;

    const p1Val = p1.scores[cat];
    const p2Val = p2.scores[cat];
    const isOpenForActive = avail.includes(cat);
    const previewVal = isOpenForActive ? previewScore(activeScores, cat, state.dice) : null;
    const isSelected = state.selected === cat;

    // Box slot: always Player 1's committed score, never a preview column.
    if(p1Val != null){
      out += `<div class="score-box abs" data-cat="${cat}" style="left:${boxLeft}px;top:${boxTop}px"><span class="num">${p1Val}</span></div>`;
    } else if(activeIdx===0 && isOpenForActive){
      out += `<div class="score-box abs previewable ${isSelected?'selected':''}" data-cat="${cat}" style="left:${boxLeft}px;top:${boxTop}px"><span class="num ${isSelected?'':'ghost'}">${previewVal}</span></div>`;
    } else {
      out += `<div class="score-box abs" data-cat="${cat}" style="left:${boxLeft}px;top:${boxTop}px"></div>`;
    }

    // Opponent numeral slot: always Player 2's committed score, never Player 1's.
    if(p2Val != null){
      out += `<div class="opp-num abs" data-cat="${cat}" style="left:${oppLeft}px;top:${boxTop}px"><span class="num">${p2Val}</span></div>`;
    } else if(activeIdx===1 && isOpenForActive){
      out += `<div class="opp-num abs previewable ${isSelected?'selected':''}" data-cat="${cat}" style="left:${oppLeft}px;top:${boxTop}px"><span class="num ${isSelected?'':'ghost-text'}">${previewVal}</span></div>`;
    } else {
      out += `<div class="opp-num abs" data-cat="${cat}" style="left:${oppLeft}px;top:${boxTop}px"></div>`;
    }
    return out;
  }

  LEFT_CATS.forEach((cat,idx)=>{
    const i = idx+1;
    html += cell(cat, pipIcon(i), 7, false, 69, 120, i);
  });
  RIGHT_CATS.forEach((cat,idx)=>{
    const i = idx+1;
    html += cell(cat, rightIcon(RIGHT_ICON_KIND[cat]), 196, true, 258, 309, i);
  });

  html += sparkleSVG(363-16, 383-12);
  html += sparkleSVG(404-16, 372-12);

  card.innerHTML = html;
}

function renderDice(){
  state.dice.forEach((d,i)=>{
    setDieFace(i, d.value, true);
    document.getElementById('dieWrap'+i).classList.toggle('held', d.held);
  });
}

function renderControls(){
  const rollBtn = document.getElementById('rollBtn');
  const canRoll = isHumanTurn() && state.rollsUsed<3 && state.phase!=='gameOver';
  rollBtn.classList.toggle('disabled', !canRoll);
  rollBtn.disabled = !canRoll;

  for(let i=1;i<=3;i++){
    const pip = document.getElementById('rollPip'+i);
    const lit = state.rollsUsed>=i;
    pip.classList.toggle('lit', lit);
    pip.classList.toggle('dim', !lit);
  }

  const playBtn = document.getElementById('playBtn');
  const canPlay = isHumanTurn() && !!state.selected && state.phase!=='gameOver';
  playBtn.classList.toggle('on', canPlay);
  playBtn.classList.toggle('off', !canPlay);
  playBtn.disabled = !canPlay;
}

function renderOverlay(){
  const overlay = document.getElementById('overlay');
  if(state.phase!=='gameOver'){
    overlay.classList.remove('show');
    overlay.innerHTML = '';
    return;
  }
  const p1 = state.players[0], p2 = state.players[1];
  const t1 = totalScore(p1), t2 = totalScore(p2);
  const winner = t1===t2 ? 'Tie game' : (t1>t2 ? (p1.name+' wins!') : (p2.name+' wins!'));
  overlay.innerHTML = `
    <div class="overlay-card">
      <div class="overlay-title">${winner}</div>
      <div class="overlay-scores">${p1.name}: ${t1}<br>${p2.name}: ${t2}</div>
      <button class="play-btn on" id="playAgainBtn"><span class="label">PLAY AGAIN</span></button>
    </div>`;
  overlay.classList.add('show');
  document.getElementById('playAgainBtn').addEventListener('click', ()=>{
    newGame();
    render();
  });
}

function fitStage(){
  const scale = Math.min(window.innerWidth/410, window.innerHeight/730);
  document.getElementById('fit').style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitStage);
fitStage();

function readProfileEmoji(){
  // Reads the Game Hub's shared profile (localStorage["gamehub.profile"]) if present.
  // Defaults-only, read-only: never written here. Missing/malformed data = no profile.
  try{
    const raw = localStorage.getItem('gamehub.profile');
    if(!raw) return null;
    const p = JSON.parse(raw);
    return (p && typeof p.emoji === 'string' && p.emoji) ? p.emoji : null;
  }catch(e){ return null; }
}

/* ---------- INPUT ---------- */
function wireInput(){
  document.getElementById('rollBtn').addEventListener('click', ()=>{
    if(!isHumanTurn() || state.rollsUsed>=3 || state.phase==='gameOver') return;
    doRoll();
  });
  document.getElementById('playBtn').addEventListener('click', ()=>{
    if(!isHumanTurn() || !state.selected) return;
    commitSelection();
  });
  document.querySelectorAll('.die').forEach((el,i)=>{
    el.addEventListener('click', ()=>{ if(isHumanTurn()) toggleHold(i); });
  });
  document.getElementById('scorecard').addEventListener('click', e=>{
    const el = e.target.closest('[data-cat]');
    if(!el || !isHumanTurn()) return;
    selectCategory(el.dataset.cat);
  });
}

buildDiceCubes();

if(DEBUG_REFERENCE){
  renderReferenceCard();
  renderReferenceDice();
  const myEmoji = readProfileEmoji();
  if(myEmoji) document.getElementById('p1avatar').textContent = myEmoji;
} else {
  newGame();
  wireInput();
  render();
}

// Dev/test seam only — not part of the visible game. Lets the verification
// harness drive deterministic rounds (forced dice) without real randomness
// or AI timing, so scoring math can be asserted headlessly per BUILD_INSTRUCTIONS
// Phase 2. No UI references this object.
window.__yzTest = {
  getState: () => state,
  render, newGame, doRoll, toggleHold, selectCategory, commitSelection, endTurn,
  categoryScore, previewScore, availableCategories, totalScore, upperSum, upperBonus,
  isGameOver, aiChooseHolds, pickCategoryForAI,
  forceDice(values){
    values.forEach((v,i)=>{ if(!state.dice[i].held) state.dice[i].value = v; });
    state.rollsUsed = Math.max(state.rollsUsed, 1);
    state.selected = null;
    state.phase = 'awaitingPick';
    render();
  },
  CATEGORIES, UPPER_KEYS, LEFT_CATS, RIGHT_CATS
};
</script>
