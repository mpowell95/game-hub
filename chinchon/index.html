<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a52">
  <title>Chinchón</title>
  <link rel="stylesheet" href="css/chinchon.css">
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #f4f6fb;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      /* NO DECORATIVE PADDING ON A GAME PAGE (2026-09-01). This was `16px 0 40px` - 56px of
         chrome around a game that already lays out to fill the screen, which is exactly the 56px
         that made chinchon 736px tall on a 664px phone. Every other game's standalone page uses
         `padding: 0` (compare boggle/tic-tac-toe/filler); chinchon was the odd one out. The
         home-indicator clearance it was presumably for is kept, honestly, via env(). */
      padding: 0 0 env(safe-area-inset-bottom, 0px);
    }
  </style>
</head>
<body>
  <div id="chinchon"></div>

  <!-- Standalone host. In the hub, the shell calls init(container)/destroy() instead. -->
  <script type="module">
    // The app is not playable without a name (see js/name-gate.js): this standalone page is a
    // door into the hub too, and an ungated one is where the leaderboard's nameless device
    // records came from. `requireName()` is a no-op once this device has a name.
    import { requireName } from '../js/name-gate.js';
    import { init } from './js/ui.js';
    await requireName();
    init(document.getElementById('chinchon'));
  </script>
</body>
</html>
