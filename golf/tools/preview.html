<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golf hole preview</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b1a33; overflow: hidden; font-family: sans-serif; }
  #canvasHost { position: fixed; inset: 0; }
  #canvasHost canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #bar { position: fixed; top: 0; left: 0; right: 0; padding: 8px; display: flex; gap: 8px;
    background: rgba(0,0,0,0.5); z-index: 2; align-items: center; }
  #bar select, #bar button { font-size: 14px; padding: 4px 8px; }
  #status { color: #fff; font-size: 12px; margin-left: auto; }
</style>
</head>
<body>
<div id="bar">
  <select id="holeSelect"></select>
  <button id="demoBtn">Fly demo shot (driver, hole tee &rarr; target)</button>
  <span id="status"></span>
</div>
<div id="canvasHost"></div>
<script type="module">
import { build } from '../js/terrain.js';
import { Renderer } from '../js/render.js';
import { CameraRig, createCamera } from '../js/camera.js';
import { simulateShot } from '../js/physics.js';
import { autoSelectClub } from '../js/clubs.js';
import { COURSES } from '../courses/registry.js';

const canvasHost = document.getElementById('canvasHost');
const select = document.getElementById('holeSelect');
const demoBtn = document.getElementById('demoBtn');
const statusEl = document.getElementById('status');

const course = COURSES[0];
for (const h of course.holes) {
  const opt = document.createElement('option');
  opt.value = h.n;
  opt.textContent = `Hole ${h.n} - Par ${h.par}`;
  select.appendChild(opt);
}

let canvas = null;
let renderer = null;
let camera = null;
let camRig = null;
let terrain = null;
let hole = null;

// ---- 30-line drag orbit camera (no OrbitControls). Spherical around a fixed target. ----
const orbit = { yaw: 0, pitch: 0.4, dist: 80, tx: 0, ty: 0, tz: 0 };
let dragging = false, lastX = 0, lastY = 0;
function attachOrbitListeners(c) {
  c.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointerup', () => { dragging = false; });
  c.addEventListener('pointercancel', () => { dragging = false; });
  c.addEventListener('pointermove', (e) => {
    if (!dragging || flying) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    orbit.yaw -= dx * 0.008;
    orbit.pitch = Math.max(0.05, Math.min(1.5, orbit.pitch - dy * 0.006));
  });
  c.addEventListener('wheel', (e) => {
    if (flying) return;
    e.preventDefault();
    orbit.dist = Math.max(5, Math.min(400, orbit.dist + e.deltaY * 0.1));
  }, { passive: false });
}
function applyOrbit() {
  const cy = Math.cos(orbit.pitch), sy = Math.sin(orbit.pitch);
  camera.position.set(
    orbit.tx + orbit.dist * cy * Math.sin(orbit.yaw),
    orbit.ty + orbit.dist * sy + 0.6,
    orbit.tz + orbit.dist * cy * Math.cos(orbit.yaw),
  );
  camera.lookAt(orbit.tx, orbit.ty + 2, orbit.tz);
}

function resize() {
  const w = canvasHost.clientWidth || window.innerWidth;
  const h = canvasHost.clientHeight || window.innerHeight;
  if (renderer) renderer.resize(w, h, camera);
}
window.addEventListener('resize', resize);

function loadHole(n) {
  flying = false;
  demoBtn.disabled = false;
  statusEl.textContent = '';
  hole = course.holes.find(x => x.n === Number(n));
  terrain = build(hole);
  // A WebGL context lost via forceContextLoss() can never be reissued on the SAME canvas
  // element - the browser permanently associates that element with the dead context, and a
  // fresh WebGLRenderer on it throws "Canvas has an existing context of a different type".
  // Skeeball hits the same wall and solves it the same way: mint a new canvas per mount rather
  // than reuse one across a dispose/recreate boundary.
  if (renderer) renderer.dispose();
  canvasHost.replaceChildren();
  canvas = document.createElement('canvas');
  canvasHost.appendChild(canvas);
  attachOrbitListeners(canvas);
  renderer = new Renderer(canvas, terrain);
  if (!camera) camera = createCamera((canvas.clientWidth || window.innerWidth) / (canvas.clientHeight || window.innerHeight));
  camRig = new CameraRig(camera, terrain);
  const midZ = (hole.tee[1] + hole.pin[1]) / 2;
  const midX = (hole.tee[0] + hole.pin[0]) / 2;
  const span = Math.hypot(hole.pin[0] - hole.tee[0], hole.pin[1] - hole.tee[1]);
  orbit.tx = midX; orbit.tz = midZ; orbit.ty = 0; orbit.dist = Math.max(40, span * 0.5); orbit.yaw = 0; orbit.pitch = 0.5;
  resize();
}
select.addEventListener('change', () => loadHole(select.value));

// ---- demo shot: physics.js's real simulateShot, no live physics - just replaying the
// precomputed trajectory with the flight/rest camera states, per §12.3 ("no physics" means no
// live cannon-es stepping in this page, not that the existing pure simulator can't be called). ----
let flying = false;
let demoSamples = null;
let demoIdx = 0;
let demoStartMs = 0;
let demoDirDeg = 0;
let demoTrail = [];

demoBtn.addEventListener('click', () => {
  if (flying) return;
  const from = { x: hole.tee[0], z: hole.tee[1] };
  const dirDeg = Math.atan2(hole.target[0] - hole.tee[0], hole.target[1] - hole.tee[1]) * 180 / Math.PI;
  const club = autoSelectClub('tee', Math.hypot(hole.target[0] - hole.tee[0], hole.target[1] - hole.tee[1]), 0);
  const r = simulateShot(terrain, {
    from, dirDeg, clubId: club, lie: 'tee', power01: 1.0, spin01: 0, wind: { x: 0, z: 0 }, seed: 7,
  });
  demoSamples = r.samples;
  demoIdx = 0;
  demoTrail = [];
  demoDirDeg = dirDeg;
  demoStartMs = performance.now();
  flying = true;
  demoBtn.disabled = true;
  camRig.setFlight(dirDeg);
  statusEl.textContent = `${club} carry ${r.carryM.toFixed(0)}m, ${demoSamples.length} samples`;
});

function stepDemo() {
  const elapsed = (performance.now() - demoStartMs) / 1000;
  while (demoIdx < demoSamples.length - 1 && demoSamples[demoIdx].t < elapsed) demoIdx++;
  const s = demoSamples[demoIdx];
  renderer.setBallPosition(s.x, s.y, s.z);
  demoTrail.push({ x: s.x, y: s.y, z: s.z });
  renderer.setTrail(demoTrail);
  camRig.update(1 / 60, s);
  if (demoIdx >= demoSamples.length - 1) {
    flying = false;
    demoBtn.disabled = false;
    camRig.setRest(s, hole.pin);
  }
}

let lastFrame = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (flying) {
    stepDemo();
  } else if (!camRig.idle) {
    camRig.update(dt, null); // let a rest tween finish, then fall back to orbit
    if (camRig.idle) applyOrbit();
  } else {
    applyOrbit();
  }
  renderer.render(camera);
}

loadHole(course.holes[0].n);
requestAnimationFrame(loop);
</script>
</body>
</html>
