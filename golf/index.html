<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Golf</title>
  <link rel="stylesheet" href="css/golf.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #eaeff7; }
    html.gh-dark, html.gh-dark body { background: #0d1420; }
    #golf { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="golf"></div>
  <script type="module">
    import { requireName } from '../js/name-gate.js';
    import { init } from './js/ui.js';

    // HANDOFF-GOLF-HOLE-EDITOR.md phase 2: the hole editor's Play button opens this page with
    // `?editor=1` so Matt can play a hole he is still designing, straight from its own
    // localStorage document - never from golf/courses/redmesa.js, which this never touches.
    // requireName() still runs as normal below; this only decides which course rounds.js sees.
    // `?editor=1` is Red Mesa (the original link); `?editor=custom` is the Course Creator's blank
    // course (2026-09-22), whose defaults follow the theme its document carries.
    const editorArg = new URLSearchParams(location.search).get('editor');
    if (editorArg) {
      try {
        const courseId = editorArg === 'custom' ? 'custom' : 'redmesa';
        const raw = localStorage.getItem(`golf.holeEditor.${courseId}.v1`);
        const doc = raw ? JSON.parse(raw) : null;
        if (doc && doc.version === 1 && doc.courseId === courseId) {
          const { makeHole } = await import('./js/holegen.js');
          let defaults;
          if (courseId === 'redmesa') ({ RM_DEFAULTS: defaults } = await import('./courses/redmesa.js'));
          else { const { THEME_DEFAULTS } = await import('../hole-editor/js/starter.js'); defaults = THEME_DEFAULTS[(doc.course && doc.course.theme) || 'parkland'] || THEME_DEFAULTS.parkland; }
          const holes = doc.order.map((id, i) => makeHole({ ...defaults, ...doc.holes[id].spec, n: i + 1 }));
          globalThis.__gfCourseOverride = {
            id: courseId,
            name: courseId === 'redmesa' ? 'Red Mesa (edit)' : ((doc.course && doc.course.name) || 'Your course'),
            theme: courseId === 'redmesa' ? 'desert' : ((doc.course && doc.course.theme) || 'parkland'),
            blurbKey: courseId === 'redmesa' ? 'blurb_redmesa' : 'blurb_custom',
            holes,
            get par() { return this.holes.reduce((a, h) => a + h.par, 0); },
          };
          globalThis.__gfNoRecord = true;
          // The setup screen lists COURSES, which rounds.js built before this script body ran
          // (static imports evaluate first), so a course that exists nowhere else joins it here -
          // and becomes the course the setup screen opens on, since that is what Play meant.
          const R = await import('./js/rounds.js');
          if (!R.COURSES.some((c) => c.id === courseId)) R.COURSES.push(globalThis.__gfCourseOverride);
          try {
            const s = JSON.parse(localStorage.getItem('gamehub.golf.v1') || '{}') || {};
            localStorage.setItem('gamehub.golf.v1', JSON.stringify({ ...s, lastCourse: courseId }));
          } catch { /* the chip is still there to tap */ }
        }
      } catch (e) {
        console.error('[golf] hole editor override failed to load - playing the shipped course instead', e);
      }
    }

    await requireName();
    init(document.getElementById('golf'));
  </script>
</body>
</html>
