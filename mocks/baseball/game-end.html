<title>Baseball mock - game end</title>
<link rel="stylesheet" href="../../css/ui.css">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="round2.css">
<style>
  .mock-phone { display: flex; align-items: center; justify-content: center; padding: 10px; }
  .r2-row { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 4px; }
  .r2-group { display: flex; flex-direction: column; gap: 8px; align-items: center; }
</style>
<div class="mock-page">
  <div class="mock-label">game-end &middot; four variants &middot; tall (361&times;714)</div>
  <div class="r2-row" id="rowTall"></div>
  <div class="mock-label" style="margin-top:10px;">game-end &middot; four variants &middot; short (361&times;530)</div>
  <div class="r2-row" id="rowShort"></div>
</div>
<script type="module">
  import { renderVariant } from './game-end.js';

  const VARIANTS = [
    { id: 'win', label: 'Career win' },
    { id: 'loss', label: 'Career loss' },
    { id: 'quick', label: 'Quick Play' },
    { id: 'ceremony', label: 'Ceremony' },
  ];

  function build(container, heightClass) {
    for (const v of VARIANTS) {
      const group = document.createElement('div');
      group.className = 'r2-group';
      const label = document.createElement('div');
      label.className = 'mock-label';
      label.textContent = v.label;
      const phone = document.createElement('div');
      phone.className = 'mock-phone ' + heightClass + ' gh-dark';
      group.appendChild(label);
      group.appendChild(phone);
      container.appendChild(group);
      renderVariant(phone, v.id);
    }
  }

  build(document.getElementById('rowTall'), 'mock-phone--tall');
  build(document.getElementById('rowShort'), 'mock-phone--short');
</script>
