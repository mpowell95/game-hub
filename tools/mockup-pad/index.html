<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mockup Pad</title>
<style>
/* Layout: one-screen app. Top bar, canvas stage, context strip, tool row at the thumb. */
:root{
  --bg:#f4f5f8; --stage:#e4e6ec; --panel:#ffffff; --fg:#16181d; --muted:#5f6370;
  --line:#d6d9e0; --accent:#2f5bea; --accent-soft:#e3e9ff; --accent-fg:#ffffff; --danger:#c8283f;
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161b; --stage:#0b0c10; --panel:#1e2027; --fg:#eceef3; --muted:#9a9fac;
  --line:#2e313a; --accent:#7390ff; --accent-soft:#232c4d; --accent-fg:#0b0c10; --danger:#ff6b81; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161b; --stage:#0b0c10; --panel:#1e2027; --fg:#eceef3; --muted:#9a9fac;
  --line:#2e313a; --accent:#7390ff; --accent-soft:#232c4d; --accent-fg:#0b0c10; --danger:#ff6b81; color-scheme:dark}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.3 var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:6px;padding:8px 16px}
.top .name{font-weight:700;letter-spacing:.01em;margin-right:auto;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:40px;padding:0 10px;
  border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 13px var(--ui);cursor:pointer;flex:none}
.btn:disabled{opacity:.35}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--danger)}
.btn:focus-visible,.tool:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg,.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#stage{position:relative;flex:1;min-height:0;background:var(--stage);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#txt{position:absolute;display:none;min-width:1em;white-space:pre;outline:1.5px dashed #2f5bea;outline-offset:2px;
  font-weight:600;font-family:var(--ui);line-height:1.25;-webkit-user-select:text;user-select:text;caret-color:#2f5bea}
#sample{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;white-space:nowrap;pointer-events:none}
.ctx{display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 16px;overflow-x:auto;border-top:1px solid var(--line);background:var(--panel);scrollbar-width:none}
.ctx::-webkit-scrollbar{display:none}
.hint{color:var(--muted);font-size:13px;margin-right:auto;white-space:nowrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent);border-color:transparent}
.custom{position:relative;overflow:hidden;background:conic-gradient(#f43f5e,#f59e0b,#22c55e,#06b6d4,#6366f1,#d946ef,#f43f5e)}
.custom input{position:absolute;inset:-8px;opacity:0;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{height:36px;min-width:36px;border:0;background:transparent;color:var(--fg);font:600 13px var(--ui);cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.sep{width:1px;align-self:stretch;background:var(--line);flex:none}
.tools{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;padding:4px 16px 8px;background:var(--panel)}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;border:0;border-radius:10px;
  background:transparent;color:var(--muted);font:600 10.5px var(--ui);cursor:pointer;min-width:0}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.menu{position:fixed;z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;min-width:210px}
.menu button{text-align:left;border:0;background:transparent;color:var(--fg);font:600 14px var(--ui);padding:11px 12px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--accent-soft)}
.menu small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(10,12,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{background:var(--panel);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
.sheet img{max-width:100%;max-height:46vh;object-fit:contain;align-self:center;border:1px solid var(--line);border-radius:8px;
  background:#fff;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row .btn{flex:1}
.sheet p{margin:0;color:var(--muted);font-size:13px}
.sheet h2{margin:0;font-size:16px}
.pages{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.thumb{position:relative;flex:none;height:46px;padding:0;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.thumb canvas{display:block;border-radius:3px}
.thumb.on{border-color:var(--accent)}
.thumb .num{position:absolute;left:3px;bottom:3px;font:700 10px var(--ui);color:#fff;background:rgba(0,0,0,.55);border-radius:4px;padding:0 4px}
.thumb .x{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;border-radius:11px;background:var(--fg);color:var(--bg);font:700 12px var(--ui);display:flex;align-items:center;justify-content:center;padding:0 6px;cursor:pointer}
.thumb .x.confirm{background:var(--danger);color:#fff}
.newproj{flex:none;height:46px;padding:0 12px;border:2px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);font:600 13px var(--ui);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.newproj svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
.addpage{flex:none;width:46px;height:46px;border:2px dashed var(--line);border-radius:8px;background:transparent;color:var(--muted);font:400 24px var(--ui);cursor:pointer}
#outList{display:flex;flex-direction:column;gap:18px}
.outpage{display:flex;flex-direction:column;gap:8px}
.outpage strong{font-size:13px}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;
  font-size:13px;font-weight:600;z-index:20;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

<div id="app">
  <header class="top">
    <button class="btn" id="openBtn">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>Picture
    </button>

    <button class="tool" data-tool="lasso" title="Free select (L)"><svg viewBox="0 0 24 24"><path d="M12 4c4.8 0 8 2.4 8 5.4S16.8 15 12 15 4 12.4 4 9.4 7.2 4 12 4z" stroke-dasharray="3 2.6"/><path d="M8.5 14.2c-1.2 2-.8 4.2 1.5 5.8"/></svg>Free</button>

    <button class="tool" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 7V4h14v3M12 4v16M9 20h6"/></svg>Text</button>

  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card">
    <h2 id="outTitle">Your picture</h2>
    <p>Press and hold a picture to Copy it or Save to Photos. Then paste it into Claude.</p>
    <div id="outList"></div>
    <button class="btn" id="closeBtn">Back to editing</button>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
const txt = $('#txt'), ctxBar = $('#ctx');
const FONT = '"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif';
const SEL = '#2f5bea';
const COLORS = ['#e11d48', '#111111', '#ffffff', '#2563eb', '#16a34a', '#f59e0b'];
const DRAW_TOOLS = new Set(['box', 'circle', 'arrow', 'pen', 'hide']);
const CORNERS = ['nw', 'ne', 'se', 'sw'], ALLH = ['nw', 'ne', 'se', 'sw', 'n', 'e', 's', 'w'];
const MAX_HIST = 12;

const S = { tool: 'select', color: COLORS[0], size: 1, fill: false, hideMode: 'pixel', cover: '#111111' };
let doc = document.createElement('canvas'), dctx = doc.getContext('2d');
let V = { s: 1, x: 0, y: 0 }, W = 0, H = 0, dpr = 1;
let floating = null, item = null, g = null, cropR = null, textEd = null, lastTextEnd = 0;
let hist = [], hi = -1, raf = 0, downloads = null;
let pages = [], cur = 0, pickMode = 'add';
let clip = null; // what Copy/Cut holds; survives switching pages
// Lifted pieces sit above the picture and stay movable until Stick. sel = index of the tapped one.
let objs = [], sel = null;
const copyObjs = a => (a || []).map(o => ({ ...o }));
function flatten(d, os) {
  if (!os || !os.length) return d;
  const c = clone(d), x = c.getContext('2d');
  for (const o of os) x.drawImage(o.img, o.x, o.y, o.w, o.h);
  return c;
}
function topObj(p) { for (let i = objs.length - 1; i >= 0; i--) if (inRect(p, objs[i])) return i; return null; }
const overlaps = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
const pointers = new Map(); let pinch = null, pinched = false;
const menu = $('#menu');
const mctx = document.createElement('canvas').getContext('2d'), hideTmp = document.createElement('canvas');

/* ---------- helpers ---------- */
const unit = () => Math.max(doc.width, doc.height) / 600;
const strokeW = () => unit() * [1.5, 3, 6][S.size];
const textSz = () => unit() * [7, 11, 16][S.size];
const norm = (a, b) => ({ x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(b.x - a.x), h: Math.abs(b.y - a.y) });
const inRect = (p, r, pad = 0) => p.x >= r.x - pad && p.y >= r.y - pad && p.x <= r.x + r.w + pad && p.y <= r.y + r.h + pad;
const toScreen = p => ({ x: V.x + p.x * V.s, y: V.y + p.y * V.s });
function local(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function toDoc(e) { const l = local(e); return { x: (l.x - V.x) / V.s, y: (l.y - V.y) / V.s }; }
function clone(c) { const n = document.createElement('canvas'); n.width = c.width; n.height = c.height; n.getContext('2d').drawImage(c, 0, 0); return n; }
function blank(w, h, color = '#ffffff') { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = color; x.fillRect(0, 0, w, h); return c; }
function clampRect(r) {
  const x1 = Math.max(0, Math.floor(r.x)), y1 = Math.max(0, Math.floor(r.y));
  const x2 = Math.min(doc.width, Math.ceil(r.x + r.w)), y2 = Math.min(doc.height, Math.ceil(r.y + r.h));
  return { x: x1, y: y1, w: Math.max(0, x2 - x1), h: Math.max(0, y2 - y1) };
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }
function luminance(hex) { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255; }
function segDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy;
  const t = L ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / L)) : 0;
  return Math.hypot(p.x - a.x - t * dx, p.y - a.y - t * dy);
}

/* ---------- autosave (stays on this device) ---------- */
let dbP = null, saveT = 0, userEdited = false;

/* ---------- cloud copy: survives the phone clearing its storage ----------
   The project is ALSO kept with this artifact: each page and lifted piece as a PNG asset, and one
   private document per person (data/users/<id>/project) listing them. The local copy above stays
   the fast path; on open, whichever copy is newer wins. A snapshot no document points at any more
   is removed right after the document moves on, so storage holds one project, not every save. */
const cloud = { ready: null, db: null, assets: null, uid: null, ids: new WeakMap(), last: [], busy: false };
let cloudT = 0, cloudJob = null, projGen = 0;
function cloudInit() {
  if (!cloud.ready) cloud.ready = (async () => {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return false;
      const [db, assets, user] = await Promise.all([window.claude.use('db'), window.claude.use('assets'), window.claude.use('user')]);
      if (!db || !assets || !user) return false;
      const uid = await user.id();
      if (!uid) return false;
      Object.assign(cloud, { db, assets, uid });
      return true;
    } catch (_) { return false; }
  })();
  return cloud.ready;
}
const cloudDoc = () => cloud.db.collection('data/users/' + cloud.uid).doc('project');
const docIds = d => (d && Array.isArray(d.pages) ? d.pages.flatMap(p => [p.a, ...((p.objs || []).map(o => o.a))]) : []).filter(Boolean);
function scheduleCloud(blobs, lifted, c, t, now) {
  cloudJob = { blobs, lifted, cur: c, t, gen: projGen };
  clearTimeout(cloudT); cloudT = setTimeout(cloudFlush, now ? 0 : 4000);
}
let cloudWarned = false;
async function cloudFlush() {
  cloudT = 0;
  if (cloud.busy || !cloudJob) return;
  const job = cloudJob; cloudJob = null;
  if (!(await cloudInit())) return;
  cloud.busy = true;
  const fresh = [];
  try {
    const up = async b => {
      if (cloud.ids.has(b)) return cloud.ids.get(b);
      const r = await cloud.assets.upload(b, { type: 'image/png' });
      cloud.ids.set(b, r.id); fresh.push(r.id); return r.id;
    };
    const out = [];
    for (let i = 0; i < job.blobs.length; i++) {
      const a = await up(job.blobs[i]), os = [];
      for (const o of (job.lifted[i] || [])) os.push({ a: await up(o.blob), x: o.x, y: o.y, w: o.w, h: o.h });
      out.push({ a, objs: os });
    }
    if (job.gen !== projGen) { for (const id of fresh) { try { await cloud.assets.delete(id); } catch (_) {} } return; }
    const doc = { v: 1, t: job.t, cur: job.cur, pages: out };
    await cloudDoc().set(doc);
    const keep = new Set(docIds(doc)), old = cloud.last;
    cloud.last = [...keep];
    for (const id of old) if (!keep.has(id)) { try { await cloud.assets.delete(id); } catch (_) {} }
  } catch (err) {
    console.warn('[mockup-pad] cloud copy not saved', err);
    if (err && err.code === 'quota_or_state' && !cloudWarned) { cloudWarned = true; toast('Cloud copy is full. This phone still has it.'); }
  } finally {
    cloud.busy = false;
    if (cloudJob) cloudFlush();
  }
}
async function cloudClear() {
  if (!(await cloudInit())) return;
  try { await cloudDoc().delete(); } catch (_) {}
  const old = cloud.last; cloud.last = [];
  for (const id of old) { try { await cloud.assets.delete(id); } catch (_) {} }
}
function idb() {
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open('mockup-pad', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function idbPut(k, v) { const d = await idb(); return new Promise((res, rej) => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(k) { const d = await idb(); return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
function scheduleSave() { userEdited = true; clearTimeout(saveT); saveT = setTimeout(() => saveNow(false), 700); }
const toBlobP = c => new Promise(res => c.toBlob(res, 'image/png'));
async function saveNow(withLive) {
  clearTimeout(saveT); saveT = 0;
  if (pages.length === 1 && pages[0].sample) return;
  try {
    const blobs = [], lifted = [];
    for (let i = 0; i < pages.length; i++) {
      const pg = pages[i];
      if (i === cur) { const b = await toBlobP(withLive ? composite(false) : doc); blobs.push(b); pg.blob = withLive ? null : b; }
      else { if (!pg.blob) pg.blob = await toBlobP(pg.doc); blobs.push(pg.blob); }
      const os = i === cur ? objs : (pg.objs || []), out = [];
      for (const o of os) { if (!o.blob) o.blob = await toBlobP(o.img); out.push({ blob: o.blob, x: o.x, y: o.y, w: o.w, h: o.h }); }
      lifted.push(out);
    }
    const t = Date.now();
    await idbPut('project', { pages: blobs, objs: lifted, cur, t });
    scheduleCloud(blobs, lifted, cur, t, withLive);
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && (saveT || item || floating || textEd || sel != null)) saveNow(true); });

/* ---------- document + history ---------- */
function setDoc(c) { doc = c; dctx = c.getContext('2d'); dctx.imageSmoothingQuality = 'high'; if (pages[cur]) pages[cur].doc = c; if (S.tool === 'crop') cropR = { x: 0, y: 0, w: doc.width, h: doc.height }; }

$('#file').onchange = e => { const f = e.target.files[0]; if (f) usePicture(f, pickMode); e.target.value = ''; };
function loadCanvas(blob, clear) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), img = new Image();
    img.onload = () => {
      const max = 4096, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
      const c = clear ? document.createElement('canvas') : blank(w, h); if (clear) { c.width = w; c.height = h; } c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('not a picture')); };
    img.src = url;
  });
}
async function usePicture(blob, mode) {
  let c; try { c = await loadCanvas(blob); } catch (_) { toast('That file could not be opened as a picture'); return; }
  hideSample();
  if (mode === 'page') { addPage(c); toast('Page added'); }
  else if (pages[cur].sample) replacePage(c);
  else addImageItem(c);
}
function addImageItem(c) {
  endText(true); commitItem(); commitFloating();
  const sc = Math.min(1, doc.width * 0.8 / c.width, doc.height * 0.8 / c.height), w = c.width * sc, h = c.height * sc;
  const cx = Math.min(Math.max((W / 2 - V.x) / V.s, w / 2), doc.width - w / 2);
  const cy = Math.min(Math.max((H / 2 - V.y) / V.s, h / 2), doc.height - h / 2);
  addObj(c, cx - w / 2, cy - h / 2, w, h);
}
document.addEventListener('paste', e => {
  if (textEd) return;
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (it) { e.preventDefault(); usePicture(it.getAsFile(), 'add'); }
  else if (clip) { e.preventDefault(); pasteClip(); }
});
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => { e.preventDefault(); const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/')); if (f) usePicture(f, 'add'); });

let outURLs = [];
$('#saveBtn').onclick = async () => {
  endText(true);
  const list = $('#outList'); list.textContent = '';
  outURLs.forEach(u => URL.revokeObjectURL(u)); outURLs = [];
  $('#outTitle').textContent = pages.length > 1 ? `Your ${pages.length} pages` : 'Your picture';
  for (let i = 0; i < pages.length; i++) {
    const b = await toBlobP(i === cur ? composite(true) : flatten(pages[i].doc, pages[i].objs));
    if (!b) continue;
    const url = URL.createObjectURL(b); outURLs.push(url);
    const box = el(`<div class="outpage">${pages.length > 1 ? `<strong>Page ${i + 1}</strong>` : ''}<img alt="Page ${i + 1}" src="${url}"><div class="row"><button class="btn primary">Copy picture</button>${downloads ? '<button class="btn">Save file</button>' : ''}</div></div>`);
    const [copyB, saveB] = box.querySelectorAll('button');
    copyB.onclick = () => copyBlob(b);
    if (saveB) saveB.onclick = () => saveBlob(b, i);
    list.append(box);
  }
  $('#sheet').hidden = false;
};
$('#closeBtn').onclick = () => { $('#sheet').hidden = true; };
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('#sheet').hidden = true; });
function copyBlob(b) {
  const blocked = () => toast('Copy was blocked here. Press and hold the picture instead.');
  try { navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]).then(() => toast('Copied. Paste it into Claude.')).catch(blocked); }
  catch (_) { blocked(); }
}
async function saveBlob(b, i) {
  if (!downloads) return;
  const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
  try { await downloads.save({ filename: `mockup-${stamp}${pages.length > 1 ? '-p' + (i + 1) : ''}.png`, data: b }); toast('Saved'); }
  catch (err) {
    if (err && err.code === 'declined') return;
    if (err && err.code === 'rate_limited') { toast('One moment, then try again'); return; }
    downloads = null; document.querySelectorAll('.outpage .row .btn:not(.primary)').forEach(x => x.hidden = true);
    toast('Saving is not available here. Press and hold the picture.');
  }
}
try { window.claude?.use?.('downloads').then(d => { downloads = d; }).catch(() => {}); } catch (_) {}

$('#undoBtn').onclick = undo;
$('#redoBtn').onclick = redo;
$('#fitBtn').onclick = fit;

document.addEventListener('keydown', e => {
  if (textEd || e.target.closest?.('input')) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'c' && (floating || sel != null)) { e.preventDefault(); copySel(); return; }
  if (mod && k === 'x' && (floating || sel != null)) { e.preventDefault(); cutSel(); return; }
  if (k === 'delete' || k === 'backspace') { if (sel != null) { e.preventDefault(); deleteObj(); } else if (item) { e.preventDefault(); deleteItem(); } else if (floating) { e.preventDefault(); deleteFloating(); } return; }
  if (k === 'enter') { if (item) commitItem(); else if (floating) commitFloating(); else if (S.tool === 'crop') applyCrop(); return; }
  if (k === 'escape') { if (sel != null) deselect(); else if (item || floating) undo(); menu.hidden = true; $('#sheet').hidden = true; return; }
  const map = { v: 'select', l: 'lasso', c: 'crop', r: 'box', o: 'circle', a: 'arrow', p: 'pen', t: 'text', h: 'hide' };
  if (!mod && map[k]) setTool(map[k]);
});

/* ---------- sample picture so the first view shows the tool working ---------- */
function hideSample() { $('#sample').hidden = true; }
pages = [pageObj(blank(1179, 2556), true)];
activate(0);
new ResizeObserver(resize).observe(stage);
async function adopt(pageBlobs, objList, c) {
  const cs = await Promise.all(pageBlobs.map(b => loadCanvas(b)));
  const os = await Promise.all(cs.map((_, i) => Promise.all(((objList && objList[i]) || []).map(async o => ({ img: await loadCanvas(o.blob, true), x: o.x, y: o.y, w: o.w, h: o.h, blob: o.blob })))));
  if (userEdited) return false;   // they already started working: never pull a project out from under them
  pages = cs.map((cv, i) => { const pg = pageObj(cv, false, os[i]); pg.blob = pageBlobs[i]; return pg; });
  hideSample(); activate(Math.min(c || 0, pages.length - 1));
  return true;
}
(async () => {
  let rec = null, shown = false;
  try {
    rec = await idbGet('project');
    if (!rec) { const old = await idbGet('current'); if (old && old.blob) rec = { pages: [old.blob], cur: 0 }; }
    if (rec && rec.pages && rec.pages.length) shown = await adopt(rec.pages, rec.objs, rec.cur);
  } catch (_) {}
  // The cloud copy: newer than this phone's (or this phone lost its copy) -> open that one.
  try {
    if (!(await cloudInit())) { if (shown) toast('Picked up where you left off'); return; }
    const snap = await cloudDoc().get();
    if (!snap.exists) { if (shown) toast('Picked up where you left off'); return; }
    const d = snap.data() || {};
    cloud.last = docIds(d);
    const localT = (rec && rec.t) || 0;
    if (!(Number(d.t) > localT) || !Array.isArray(d.pages) || !d.pages.length) {
      // Same save as this phone's: remember which uploads these pages already are.
      if (Number(d.t) === localT && rec && rec.pages && rec.pages.length === d.pages.length) {
        d.pages.forEach((p, i) => { if (pages[i] && pages[i].blob) cloud.ids.set(pages[i].blob, p.a); });
      }
      if (shown) toast('Picked up where you left off');
      return;
    }
    const get = async id => (await fetch('/_blob/' + id)).blob();
    const pb = await Promise.all(d.pages.map(p => get(p.a)));
    const ob = await Promise.all(d.pages.map(p => Promise.all((p.objs || []).map(async o => ({ blob: await get(o.a), a: o.a, x: o.x, y: o.y, w: o.w, h: o.h })))));
    pb.forEach((b, i) => cloud.ids.set(b, d.pages[i].a));
    ob.flat().forEach(o => cloud.ids.set(o.blob, o.a));
    if (await adopt(pb, ob, d.cur)) {
      try { await idbPut('project', { pages: pb, objs: ob.map(l => l.map(o => ({ blob: o.blob, x: o.x, y: o.y, w: o.w, h: o.h }))), cur: d.cur || 0, t: Number(d.t) }); } catch (_) {}
      toast('Picked up where you left off');
    }
  } catch (err) { console.warn('[mockup-pad] cloud copy not read', err); if (shown) toast('Picked up where you left off'); }
})();
})();
</script>
