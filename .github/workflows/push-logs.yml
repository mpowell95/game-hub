# Push notification health check (2026-11-11, Matt: "I'm not getting notifications anymore").
# Run by hand (Actions > Push logs > Run workflow). Reads the last DAYS days of the push Cloud
# Functions' logs with the deploy account (Editor role can read logs) and prints TOTALS ONLY
# (tools/push-log-summary.mjs): no player code, key or address, since this repo's logs are public.
# Deploys nothing, writes nothing.
name: Push logs

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back'
        default: '4'

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign in
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read and summarise
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name:"push" AND (jsonPayload.message:* OR severity>=ERROR)' \
            --project game-hub-5b91c --freshness="${{ inputs.days || '4' }}d" --limit 20000 --format=json > logs.json
          node tools/push-log-summary.mjs logs.json
