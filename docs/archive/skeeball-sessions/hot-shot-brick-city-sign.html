<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOT SHOT: BRICK CITY — marquee sign spec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
  /* ===================================================================
     HOT SHOT: BRICK CITY — the marquee sign, exactly as approved.
     Skeeball machine 3 (board id: brickcity).

     This is the DESIGN SPEC, not shipping code. In the game the marquee
     is one mesh tinted look.marquee (skeeball/js/machines/<id>/render.js,
     _build, ~line 518); reproduce this as a painted canvas texture the
     same way _paintField / _paintLane paint the board and lane, with
     SRGBColorSpace declared.

     PALETTE -> boards.js look keys
       #A33427  brick, panel .................. marquee
       #6E2018  brick, deep (bottom of panel) . -
       #FFC53D  bulb yellow, HOT SHOT letters . marqueeText, bulb
       #FF6B2C  ember glow, and the ball ...... glow
       #EDE6DA  chalk: plate border, net ...... net, value
       #14161B  asphalt: plate fill, trim ..... cabinetEdge, pocket
       #1E63B8  court blue (kept from HOT SHOT) face
     =================================================================== */

  :root {
    --asphalt:    #14161B;
    --brick:      #A33427;
    --brick-deep: #6E2018;
    --ember:      #FF6B2C;
    --bulb:       #FFC53D;
    --chalk:      #EDE6DA;
    --display: "Bungee", "Impact", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #0D0E12;
    display: grid;
    place-items: center;
    padding: 6vmin 4vmin;
  }

  .sign {
    --edge: #0D0E12;
    position: relative;
    width: 100%;
    max-width: 720px;
    min-width: 300px;
    background: linear-gradient(180deg, var(--brick) 0%, var(--brick-deep) 100%);
    border: 6px solid var(--bulb);
    border-radius: 3px;
    box-shadow:
      0 0 0 5px var(--edge),
      0 0 42px rgba(255,107,44,.34),
      0 26px 60px rgba(0,0,0,.6);
    padding: clamp(1.6rem, 4vw, 2.4rem) clamp(1rem, 4vw, 2.6rem) clamp(1.1rem, 3vw, 1.7rem);
    text-align: center;
    isolation: isolate;
  }

  /* Brick coursing: mortar lines every 26px horizontally, 58px vertically,
     with alternate courses offset half a brick (the ::after layer). */
  .sign::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: .5;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.34) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 1px, transparent 1px 58px);
  }
  .sign::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: .5;
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 1px, transparent 1px 58px);
    background-position: 29px 13px;
    -webkit-mask-image: repeating-linear-gradient(0deg, #000 0 26px, transparent 26px 52px);
    mask-image: repeating-linear-gradient(0deg, #000 0 26px, transparent 26px 52px);
  }

  /* Bulb bars, top and bottom. The cabinet already builds four bulbs across
     boardW; this is the look they should have. */
  .bulbs {
    display: flex;
    justify-content: space-between;
    padding: 0 .35rem;
    margin-bottom: clamp(.8rem, 2vw, 1.2rem);
  }
  .bulbs.bottom { margin: clamp(.9rem, 2vw, 1.3rem) 0 0; }

  .bulb {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--bulb);
    box-shadow: 0 0 10px 2px rgba(255,197,61,.75), inset 0 -2px 3px rgba(160,105,0,.5);
    animation: chase 1.6s steps(1, end) infinite;
  }
  .bulb:nth-child(3n+2) { animation-delay: .53s; }
  .bulb:nth-child(3n+3) { animation-delay: 1.06s; }

  @keyframes chase {
    0%, 66%   { opacity: 1; }
    67%, 100% { opacity: .34; }
  }

  /* The name. Heavy signage lettering, lit yellow, ember halo,
     hard drop shadow in the deep brick so it sits ON the wall. */
  .hot {
    font-family: var(--display);
    font-size: clamp(2.6rem, 1rem + 9vw, 6.4rem);
    line-height: .92;
    letter-spacing: .01em;
    color: var(--bulb);
    text-shadow:
      0 0 2px  rgba(255,197,61,.9),
      0 0 18px rgba(255,107,44,.85),
      0 0 48px rgba(255,107,44,.45),
      0 5px 0  var(--brick-deep);
    margin: 0;
  }

  /* The sub-name plate: dark fill so it does not fight the glow above it. */
  .plate {
    margin: clamp(.9rem, 2.4vw, 1.4rem) auto 0;
    display: inline-flex;
    align-items: center;
    gap: clamp(.6rem, 2vw, 1.1rem);
    background: var(--asphalt);
    border: 3px solid var(--chalk);
    border-radius: 2px;
    padding: clamp(.35rem, 1.4vw, .6rem) clamp(.9rem, 3vw, 1.6rem);
    box-shadow: 0 6px 0 rgba(0,0,0,.45);
  }
  .plate .city {
    font-family: var(--display);
    font-size: clamp(1rem, .45rem + 2.3vw, 1.9rem);
    letter-spacing: .04em;
    color: var(--chalk);
    line-height: 1;
    white-space: nowrap;
  }
  .plate svg { display: block; flex: none; }

  @media (prefers-reduced-motion: reduce) {
    .bulb { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

  <div class="sign">
    <div class="bulbs" aria-hidden="true">
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    </div>

    <p class="hot">HOT SHOT</p>

    <div class="plate">
      <svg width="30" height="30" viewBox="0 0 30 30" role="img" aria-label="Basketball dropping through a rim">
        <circle cx="15" cy="10" r="6.4" fill="#FF6B2C" stroke="#0D0E12" stroke-width="1.4"/>
        <path d="M8.6 10h12.8M15 3.6v12.8M10.5 5.5c2.6 2.6 2.6 6.4 0 9M19.5 5.5c-2.6 2.6-2.6 6.4 0 9"
              fill="none" stroke="#0D0E12" stroke-width="1.1" stroke-linecap="round"/>
        <ellipse cx="15" cy="19.4" rx="9.6" ry="2.6" fill="none" stroke="#EDE6DA" stroke-width="2"/>
        <path d="M6.6 20.2 9 26M23.4 20.2 21 26M11 21.2l.8 5.6M19 21.2l-.8 5.6M15 21.6v5.8"
              fill="none" stroke="#EDE6DA" stroke-width="1" stroke-linecap="round" opacity=".85"/>
      </svg>
      <span class="city">BRICK CITY</span>
    </div>

    <div class="bulbs bottom" aria-hidden="true">
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    </div>
  </div>

</body>
</html>
