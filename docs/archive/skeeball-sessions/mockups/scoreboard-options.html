<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scoreboard options</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #150f14; color: #f7ecd8;
    font: 14px/1.45 system-ui, -apple-system, sans-serif;
    padding: 14px 12px 46px;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.note { font-size: 12px; opacity: .68; margin: 0 0 6px; }
  h2 { font-size: 13px; margin: 26px 0 2px; letter-spacing: .06em; text-transform: uppercase; color: #7ec8f0; }
  p.sub { font-size: 12px; opacity: .75; margin: 0 0 8px; }
  .lbl { font-size: 10px; opacity: .5; letter-spacing: .1em; text-transform: uppercase; margin: 9px 0 3px; }
  canvas { display: block; }
  .hud { background:#241a20; border:1px solid #4a3a44; border-radius:5px; padding:5px 7px;
         font-size:10px; display:flex; justify-content:space-between; margin-bottom:5px; }
  .hud b { color:#ffb02e; }
  .hud span { color:#7ec8f0; letter-spacing:.08em; }
</style>
</head>
<body>

<h1>Scoreboard — new directions</h1>
<p class="note">
  The panel is <b>181 &times; 136 real pixels</b>. The last three options all tried to fit four
  numbers into that box. These three change the problem instead: move data off it, show less on
  it, or make it bigger.
</p>

<div id="out"></div>

<script>
const W = 181, H = 136;
const AM = '#ffb02e', CY = '#7ec8f0', BG = '#070405', BZ = '#c98a3a';
const D = { hub:'1250', best:'500', today:'250', last:'190', name:'MATTYPOW' };

function panel(h) {
  const c = document.createElement('canvas');
  c.width = W; c.height = h || H;
  const x = c.getContext('2d');
  x.fillStyle = BG; x.fillRect(0,0,c.width,c.height);
  x.strokeStyle = BZ; x.lineWidth = 2; x.strokeRect(1,1,c.width-2,c.height-2);
  x.textAlign='center'; x.textBaseline='middle';
  return [c, x];
}

// D - the machine shows ONLY the hub wide record. The three personal numbers move to the header.
function optionD() {
  const [c,x] = panel();
  x.fillStyle=CY; x.font='700 12px Verdana'; x.fillText('HUB WIDE RECORD', W/2, 26);
  x.fillStyle=AM; x.font='700 62px Verdana'; x.fillText(D.hub, W/2, 74);
  x.fillStyle=AM; x.font='700 22px Verdana'; x.fillText(D.name, W/2, 115);
  return c;
}

// E - two lines: the record, and your best against it. Today and Last Game move to the header.
function optionE() {
  const [c,x] = panel();
  x.fillStyle=CY; x.font='700 10px Verdana'; x.fillText('HUB WIDE RECORD', W/2, 18);
  x.fillStyle=AM; x.font='700 40px Verdana'; x.fillText(D.hub, W/2, 45);
  x.fillStyle=AM; x.font='700 13px Verdana'; x.fillText(D.name, W/2, 68);
  x.strokeStyle='rgba(201,138,58,.4)'; x.lineWidth=1;
  x.beginPath(); x.moveTo(10,82); x.lineTo(W-10,82); x.stroke();
  x.fillStyle=CY; x.font='700 10px Verdana'; x.fillText('YOUR BEST', W/2, 96);
  x.fillStyle=AM; x.font='700 32px Verdana'; x.fillText(D.best, W/2, 119);
  return c;
}

// F - same four values, but the panel grows upward into the dead space over the machine.
function optionF() {
  const HF = 250;
  const [c,x] = panel(HF);
  const rows = [['HUB WIDE RECORD',D.hub,D.name],['YOUR BEST',D.best,''],['TODAY',D.today,''],['LAST GAME',D.last,'']];
  const hs = [88,54,54,54];
  let y0 = 0;
  rows.forEach((r,i) => {
    if (i) { x.strokeStyle='rgba(201,138,58,.3)'; x.lineWidth=1;
      x.beginPath(); x.moveTo(8,y0); x.lineTo(W-8,y0); x.stroke(); }
    x.fillStyle=CY; x.font='700 11px Verdana'; x.textAlign='left';
    x.fillText(r[0], 10, y0 + (r[2] ? 16 : hs[i]/2));
    x.fillStyle=AM; x.font='700 '+(r[2]?42:34)+'px Verdana'; x.textAlign='right';
    x.fillText(r[1], W-10, y0 + (r[2] ? 46 : hs[i]/2));
    if (r[2]) { x.fillStyle=AM; x.font='700 16px Verdana'; x.fillText(r[2], W-10, y0+74); }
    y0 += hs[i];
  });
  return c;
}

const out = document.getElementById('out');
function hudStrip(text) {
  const d = document.createElement('div'); d.className='hud'; d.innerHTML = text; return d;
}
function show(title, sub, canvas, hud) {
  let h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
  let p = document.createElement('p'); p.className='sub'; p.textContent = sub; out.appendChild(p);
  let l = document.createElement('div'); l.className='lbl'; l.textContent='actual size on the machine';
  out.appendChild(l);
  if (hud) out.appendChild(hudStrip(hud));
  out.appendChild(canvas);
  l = document.createElement('div'); l.className='lbl'; l.textContent='enlarged 2x'; out.appendChild(l);
  const big = document.createElement('canvas');
  big.width = canvas.width*2; big.height = canvas.height*2;
  big.style.width = Math.min(canvas.width*2, window.innerWidth-24)+'px';
  big.getContext('2d').drawImage(canvas, 0, 0, big.width, big.height);
  out.appendChild(big);
}

show('D — the machine is the hall of fame',
     'The backboard shows one thing: the hub wide record and who holds it, at 62px. Your Best, Today and Last Game move to the header bar, which has empty space beside the score. Nothing is cramped because nothing is competing.',
     optionD(),
     '<span>BEST</span> <b>500</b> &nbsp; <span>TODAY</span> <b>250</b> &nbsp; <span>LAST</span> <b>190</b>');

show('E — the record and your shot at it',
     'Only the two numbers that mean anything mid-rack: the record to beat, and your best. Today and Last Game go to the header. Digits 40px and 32px.',
     optionE(),
     '<span>TODAY</span> <b>250</b> &nbsp; <span>LAST</span> <b>190</b>');

show('F — make the panel bigger',
     'All four stay on the machine, but the backboard grows upward into the dead space above it (250px instead of 136). Rows get 54-88px each, digits 34-42px. Costs screen height that is currently empty.',
     optionF());
</script>
</body>
</html>
