<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Weaver Hints</title><style>
:root{--bg:#eef0f4;--fg:#1b2333;--sub:#5b6475}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--fg:#e8eaee;--sub:#9aa3b2}}
:root[data-theme="dark"]{--bg:#14171d;--fg:#e8eaee;--sub:#9aa3b2}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;padding:24px 16px}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
figcaption{font-weight:700;font-size:15px;color:var(--sub)}
.ph{position:relative;width:402px;height:874px;border-radius:36px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25);transform-origin:top left}
.ph img{display:block;width:402px;height:874px}
.chip{position:absolute;left:243px;top:8px;width:89px;height:44px;border-radius:22px;background:#3b3f4f;display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;font:700 18px system-ui,sans-serif}
.dim{position:absolute;inset:0;background:rgba(10,14,25,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));color:#1b2333}
.grab{width:40px;height:5px;border-radius:3px;background:#d4d8e0;margin:0 auto 10px}
.row{display:flex;align-items:center;gap:14px;height:64px;padding:0 6px;border-radius:14px}
.row+.row{border-top:1px solid #eef0f4}
.row.off{opacity:.38}
.nm{flex:1;font:700 20px system-ui,sans-serif}
.cost{display:flex;align-items:center;gap:5px;font:800 20px system-ui,sans-serif}
.sep{height:8px;background:#eef0f4;margin:6px -16px}
.ic{display:flex;gap:3px;width:84px}
.ic .t{width:24px;height:24px;border-radius:5px;background:#dfe3ea;font:800 15px system-ui;display:flex;align-items:center;justify-content:center;font-style:normal;color:#1b2333}
.ic .t.f{background:#fff;box-shadow:inset 0 0 0 2px #1b2333}
.ic .t.tap{background:#fff;box-shadow:inset 0 0 0 2.5px #F2B705,0 0 0 2px #fff,0 0 0 4px #1b2333}
.ic.bulb{justify-content:flex-start;color:#1b2333}
.glow{position:absolute;width:41px;height:41px;border-radius:7px;border:3px dashed #ffce3a;box-shadow:0 0 12px rgba(255,206,58,.75);animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{transform:scale(.9)}}
@media (prefers-reduced-motion:reduce){.glow{animation:none}}
.pill{position:absolute;left:50%;top:508px;transform:translateX(-50%);background:#1b2333;color:#fff;border-radius:22px;height:44px;padding:0 8px 0 14px;display:flex;align-items:center;gap:8px;font:700 17px system-ui,sans-serif;white-space:nowrap}
.pill .x{width:30px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:14px}
@media (max-width:440px){.ph{transform:scale(.85);margin-bottom:-131px;margin-right:-60px}}
</style></head><body><div class="wrap">
