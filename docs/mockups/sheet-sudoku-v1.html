<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sudoku sheet</title><style>*{box-sizing:border-box;margin:0;padding:0}
body{background:#07090d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:#F1F3F6;padding:24px}
.phone{position:relative;width:402px;height:874px;border-radius:44px;overflow:hidden;background:#11141b;border:1px solid #262b35}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:#141821;border-top:1px solid #222834;display:flex;justify-content:space-around;padding-top:16px;z-index:4}
.tabs i{width:30px;height:28px;border-radius:7px;background:#3a4150}.tabs i.on{background:#e8b72a}
.gamebar{position:absolute;top:56px;left:0;right:0;height:80px;display:flex;align-items:center;gap:12px;padding:0 20px}
.art svg{width:62px;height:35px;display:block;border-radius:8px}
.gname{flex:1;font-size:22px;font-weight:800}
.play{background:#2b4a85;border-radius:24px;padding:12px 22px;font-weight:700}
.scrim{position:absolute;inset:0;background:rgba(5,8,14,.55);z-index:1}
.sheet{position:absolute;z-index:2;left:0;right:0;bottom:0;background:#191c23;border-radius:22px 22px 0 0;padding:10px 16px 108px;display:flex;flex-direction:column;gap:18px}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:#3a4150}
.hd{display:flex;align-items:center;gap:14px;padding:4px 2px 0}
h2{font-size:24px;font-weight:800}
.card{border:1px solid #2B313B;border-radius:14px;background:#1E222A;overflow:hidden}
.ch{padding:11px 14px;font-weight:800;font-size:16px;background:#2a2f3a}
.one{padding:14px;font-size:16px;line-height:1.4}
.dim{color:#8a93a3;font-size:14px}
ol,ul{padding:12px 14px 12px 34px;font-size:16px;line-height:1.4}
li+li{margin-top:8px} ol li::marker{font-weight:800}
.r{display:flex;align-items:center;gap:12px;padding:0 14px;height:46px;border-top:1px solid rgba(255,255,255,.06)}
.ch+.r{border-top:0}
.r .l{flex:1;font-size:16px}.r b{font-size:20px;font-weight:800;min-width:60px;text-align:center}
.r .v{min-width:60px;text-align:center;font-size:16px}
.hdr{display:flex;padding:8px 14px 4px;font-size:13px;font-weight:600;color:#8a93a3}.hdr span:first-child{flex:1}.hdr span+span{min-width:60px;text-align:center}
.sh{display:inline-flex;width:20px;height:20px;background:#fff;border-radius:4px;padding:2px;flex:none}
.sh.x2{width:34px}.sh svg{width:100%;height:100%;display:block}
.done{margin-top:6px;width:100%;background:#7AA7FF;color:#0c1424;border-radius:16px;height:54px;font-size:18px;font-weight:700;border:0;font-family:inherit}
</style></head><body>

  </svg></span><span class="gname">Sudoku</span><span class="play">Play</span></div><div class="scrim"></div>

    </g>
    <g fill="#efe3f5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      <text x="48" y="30">5</text>
      <text x="80" y="22">2</text>
      <text x="104" y="46">9</text>
      <text x="56" y="62">7</text>
      <text x="112" y="78">4</text>
    </g>
    <rect x="68.5" y="33.5" width="15" height="15" fill="none" stroke="#ffce3a" stroke-width="2.5"/>
  </svg></span><h2>Sudoku</h2></div><div class="card"><div class="ch">How it is ranked</div><ol><li>No hints beats hints</li><li>Harder level beats easier</li><li>More solved beats fewer</li></ol><div class="one dim" style="padding-top:0">Mistakes count as hints.</div></div><button class="done">Done</button></div>
