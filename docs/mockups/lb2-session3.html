<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard v2 session 3</title>
<style>
:root{--bg:#0E1014;--surf:#171A20;--text:#F1F3F6;--muted:#A2A9B5;--line:#272B33;--accent:#7AA7FF;--seg:#1F232A;--segOn:#323844;--you:#1C2D4D}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05060a;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:10px}
.cap{font:600 15px system-ui;color:#cfd5df;width:402px}
.ph{width:402px;height:874px;background:var(--bg);border-radius:28px;overflow:hidden;position:relative;display:flex;flex-direction:column;border:1px solid #222}
.sb{height:50px;flex:none}
.body{flex:1;overflow:hidden;padding:0 16px}
.tabbar{height:68px;flex:none;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;background:var(--bg)}
.tabbar i{width:26px;height:26px;border-radius:6px;background:#3a4150;display:block}
.tabbar i.on{background:#f2b705}
.num{font-variant-numeric:tabular-nums}
h1.big{font-size:30px;font-weight:800}
.trow{display:flex;align-items:center;justify-content:space-between;height:52px}
.icons{display:flex;gap:14px}
.ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ic svg{width:24px;height:24px}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:3px;height:44px;margin-top:8px}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:16px;color:var(--muted);gap:6px}
.seg span.on{background:var(--segOn);color:var(--text);font-weight:600}
.frow{display:flex;gap:8px;margin-top:8px}
.frow .seg{flex:1;margin:0}
.sortb{width:44px;height:44px;border-radius:12px;background:var(--seg);display:flex;align-items:center;justify-content:center;color:var(--text);margin-top:0}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px}
.row{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:62px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.sm{min-height:50px}
.art{width:62px;height:36px;border-radius:7px;overflow:hidden;flex:none}
.art svg{width:100%;height:100%;display:block}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.t1{font-size:17px;font-weight:600}
.t2{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:4px}
.me{color:var(--accent)}
.chev{color:#59606d;font-size:20px;width:10px}
.right{display:flex;align-items:center;gap:6px;font-size:16px}
.ctm{position:relative;display:inline-block;flex:none}
.ctm img{display:block;width:100%;height:100%}
.ctm b{position:absolute;transform:translate(-50%,-50%);font-weight:900;line-height:1;left:50%;top:69%}
.bar{display:flex;align-items:center;gap:10px;height:62px}
.back{width:30px;color:var(--text);font-size:28px}
.face{width:44px;height:44px;border-radius:50%;background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:24px}
.play{background:var(--accent);color:#0E1014;font-weight:700;border-radius:20px;padding:8px 16px;font-size:16px}
.heart{color:var(--accent);font-size:22px}
.key{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:10px 4px 0}
.key span{display:flex;align-items:center;gap:4px}
.lr{display:grid;grid-template-columns:44px 1fr auto 10px;align-items:center;gap:8px;padding:6px 10px 6px 0;min-height:66px;border-top:1px solid var(--line);position:relative}
.lr:first-child{border-top:0}
.lr .rk{text-align:center;color:var(--muted);font-weight:700}
.lr.g{background:linear-gradient(90deg,#3a3014,#262113);box-shadow:inset 4px 0 #E0A92E}
.lr.s{box-shadow:inset 4px 0 #B9C0CA}
.lr.b{box-shadow:inset 4px 0 #C98A55}
.lr.meRow{background:var(--you)}
.sub{display:flex;gap:3px;margin-top:2px}
.h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:none;margin:16px 4px 0}
.stat{display:flex;justify-content:space-between;align-items:center;padding:0 14px;height:48px;border-top:1px solid var(--line);font-size:16px}
.stat:first-child{border-top:0}
.stat b{font-weight:700}
.medals{display:grid;grid-template-columns:repeat(4,1fr);padding:12px 6px 10px;text-align:center}
.medals div{display:flex;flex-direction:column;align-items:center;gap:4px}
.medals small{font-size:12px;color:var(--muted)}
.medals .n{font-size:20px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;color:var(--muted);font-weight:600;text-align:right;padding:10px 14px 6px}
th:first-child{text-align:left}
td{padding:0 14px;height:44px;border-top:1px solid var(--line);text-align:right}
td:first-child{text-align:left}
td .lbl{display:inline-flex;align-items:center;gap:8px}
.tile{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;border-radius:4px}
.tile.w{background:#fff}
.tile svg{width:13px;height:13px}
.dim{color:#59606d}
</style>
</head>
<body>
<div class="col"><div class="cap">Games</div><div class="ph" id="a"></div></div>
<div class="col"><div class="cap">Contexto</div><div class="ph" id="b"></div></div>
<div class="col"><div class="cap">*King of Games* · Contexto</div><div class="ph" id="c"></div></div>
<div class="col"><div class="cap">MattyIce · Arrow Maze</div><div class="ph" id="d"></div></div>
<div class="col"><div class="cap">Anita Bonita · Sudoku</div><div class="ph" id="e"></div></div>
<script type="module">
import { GAME_ART } from '../../js/game-art.js';
import { diffShapeSVG } from '../../js/difficulty-tiers.js';
const IMG = { gold: ['medal-gold.png', 115 / 180, '#7a3e00'], silver: ['medal-silver.png', 114 / 180, '#3d3d42'], bronze: ['medal-bronze.png', 114 / 180, '#5c2304'], iron: ['medal-iron.png', 114 / 180, '#fff'] };
const med = (k, n, h) => { const [f, ar, col] = IMG[k]; const fs = Math.round(h * (String(n ?? '').length >= 2 ? 0.3 : 0.4)); return `<span class="ctm" style="height:${h}px;width:${Math.round(h * ar)}px"><img src="../../icons/${f}">${n == null ? '' : `<b style="font-size:${fs}px;color:${col}">${n}</b>`}</span>`; };
const place = (r) => med(['gold', 'silver', 'bronze'][r - 1], r, 34);
const art = (id) => `<span class="art">${GAME_ART[id] || ''}</span>`;
const shp = (t) => `<span class="tile${t >= 3 ? ' w' : ''}">${diffShapeSVG(t)}</span>`;
const SEARCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>';
const HELP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>';
const SORT = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>';
const MSG = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#7AA7FF" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>';
const tabs = '<div class="tabbar"><i></i><i></i><i></i><i class="on"></i><i></i></div>';
const frame = (inner) => `<div class="sb"></div><div class="body">${inner}</div>${tabs}`;
const gameRow = (id, name, who, me, right) => `<div class="row">${art(id)}<span class="grow"><span class="t1">${name}</span><span class="t2">${med('gold', 1, 20)}<span class="${me ? 'me' : ''}">${who}</span></span></span><span class="right">${right}</span><span class="chev">›</span></div>`;

// 1. Games list
document.getElementById('a').innerHTML = frame(`
  <div class="trow"><h1 class="big">Leaderboard</h1><span class="icons"><span class="ic">${SEARCH}</span><span class="ic">${HELP}</span></span></div>
  <div class="seg"><span class="on">Games</span><span>Hall of Fame</span><span>Me</span></div>
  <div class="frow"><div class="seg"><span class="on">♥ 9</span><span>Played 31</span><span>All 34</span></div><span class="sortb">${SORT}</span></div>
  <div class="card">
    ${gameRow('way-out', 'Arrow Maze', 'MattyIce', 1, place(1))}
    ${gameRow('contexto', 'Contexto', '*King of Games*', 0, '<b class="dim num" style="color:#cfd5df">#5</b>')}
    ${gameRow('cuppong', 'Cup Pong', '*King of Games*', 0, place(3))}
    ${gameRow('darts', 'Darts', '*King of Games*', 0, place(3))}
    ${gameRow('flick-soccer', 'Flick Soccer', 'MattyIce', 1, place(1))}
    ${gameRow('minesweeper', 'Minesweeper', 'Unai', 0, place(2))}
    ${gameRow('eight-ball', 'Pool', '*King of Games*', 0, place(2))}
  </div>`);

// 2. Contexto board
const lr = (cls, rk, name, subs, n, me) => `<div class="lr ${cls}"><span class="rk">${rk}</span><span><span class="t1 ${me ? 'me' : ''}">${name}</span><span class="sub">${subs.map(([k, v]) => med(k, v, 26)).join('')}</span></span>${med('gold', n, 46)}<span class="chev">›</span></div>`;
document.getElementById('b').innerHTML = frame(`
  <div class="bar"><span class="back">‹</span>${art('contexto')}<span class="grow"><span class="t1" style="font-size:22px;font-weight:700">Contexto</span><span class="t2">36 played</span></span><span class="play">Play</span><span class="heart">♥</span></div>
  <div class="seg"><span>Daily</span><span class="on">All</span></div>
  <div class="key"><span>${med('gold', null, 18)}0 hints</span><span>${med('silver', null, 18)}1 hint</span><span>${med('bronze', null, 18)}2 hints</span><span>${med('iron', null, 18)}3+ hints</span></div>
  <div class="card">
    ${lr('g', med('gold', 1, 30), '*King of Games*', [['iron', 3]], 9)}
    ${lr('s', med('silver', 2, 30), 'Ele', [['silver', 2]], 4)}
    ${lr('b', med('bronze', 3, 30), 'Natalia', [['silver', 2], ['bronze', 5], ['iron', 1]], 2)}
    ${lr('', '#4', 'Anita Bonita', [['silver', 1]], 2)}
    ${lr('meRow', '#5', 'MattyIce', [['bronze', 1]], 2, 1)}
  </div>`);

// shared: a person's page for one game
const personBar = (face, name, game) => `<div class="bar"><span class="back">‹</span><span class="face">${face}</span><span class="grow"><span class="t1" style="font-size:22px;font-weight:700">${name}</span><span class="t2">${game}</span></span>${MSG}</div>`;
const headCard = (id, name, played, right) => `<div class="card"><div class="row">${art(id)}<span class="grow"><span class="t1">${name}</span><span class="t2">${played}</span></span><span class="right num">${right}</span></div></div>`;
const stats = (rows) => `<div class="card">${rows.map(([l, v]) => `<div class="stat"><span>${l}</span><b class="num">${v}</b></div>`).join('')}</div>`;
const allGames = '<div class="card"><div class="stat"><span>All games</span><span class="chev">›</span></div></div>';
const table = (title, cols, rows) => `<div class="h2">${title}</div><div class="card"><table><tr><th></th>${cols.map((c) => `<th>${c}</th>`).join('')}</tr>${rows.map((r) => `<tr><td><span class="lbl">${r[0]}</span></td>${r.slice(1).map((v) => `<td class="num${v === '–' || v === 0 ? ' dim' : ''}">${v}</td>`).join('')}</tr>`).join('')}</table></div>`;
const tier = (t, w) => `${shp(t)}${w}`;

// 3. King of Games, Contexto
document.getElementById('c').innerHTML = frame(`
  ${personBar('🤴', '*King of Games*', 'Contexto')}
  ${headCard('contexto', 'Contexto', '14 played', `9 ${med('gold', 1, 34)}`)}
  <div class="card"><div class="medals">
    <div>${med('gold', null, 34)}<span class="n num">9</span><small>0 hints</small></div>
    <div>${med('silver', null, 34)}<span class="n num">0</span><small>1 hint</small></div>
    <div>${med('bronze', null, 34)}<span class="n num">0</span><small>2 hints</small></div>
    <div>${med('iron', null, 34)}<span class="n num">3</span><small>3+ hints</small></div>
  </div></div>
  ${stats([['Solved', 12], ['Average guesses', '36.5'], ['Fewest guesses', 1]])}
  ${table('Language', ['Played', 'Solved'], [['English', 14, 12], ['Spanish', 0, 0]])}
  ${allGames}`);

// 4. MattyIce, Arrow Maze
document.getElementById('d').innerHTML = frame(`
  ${personBar('🧊', '<span class="me">MattyIce</span>', 'Arrow Maze')}
  ${headCard('way-out', 'Arrow Maze', '281 played', `1,052 pts ${med('gold', 1, 34)}`)}
  ${stats([['Points', '1,052'], ['Levels cleared', 281]])}
  ${table('Difficulty', ['Cleared', 'Points', 'Timed'], [[tier(1, 'Easy'), 21, 21, 20], [tier(2, 'Medium'), 51, 90, 41], [tier(3, 'Hard'), 105, 388, 102], [tier(4, 'Expert'), 104, 553, 103]])}
  ${table('Rush', ['This week', 'Best week', 'Runs'], [[tier(1, 'Easy'), '–', 175, 9], [tier(3, 'Hard'), '–', 59, 4]])}
  ${allGames}`);

// 5. Anita Bonita, Sudoku
document.getElementById('e').innerHTML = frame(`
  ${personBar('A', 'Anita Bonita', 'Sudoku')}
  ${headCard('sudoku', 'Sudoku', '2 played', `2 solved ${med('gold', 1, 34)}`)}
  ${stats([['Solved', 2], ['Perfect', 0], ['Hints used', 0], ['Mistakes', 9]])}
  ${table('Difficulty', ['Solved', 'Best time'], [[tier(1, 'Easy'), 0, '–'], [tier(2, 'Medium'), 2, '9:40'], [tier(3, 'Hard'), 0, '–'], [tier(4, 'Expert'), 0, '–']])}
  ${allGames}`);
</script>
</body>
</html>
