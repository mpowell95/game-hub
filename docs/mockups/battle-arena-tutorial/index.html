<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Battle Arena Tutorial</title>
<style>
  :root { --bg: #14171c; --fg: #f4f6fa; --chip: #ffce3a; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  h1 { font-size: 26px; margin: 20px 16px 4px; }
  h2 { font-size: 20px; margin: 22px 16px 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 18px; padding: 0 16px; }
  figure { margin: 0; width: 240px; }
  figure img { width: 100%; border-radius: 18px; display: block; border: 1px solid #2c323c; }
  figcaption { margin-top: 8px; font-size: 17px; font-weight: 700; }
  figcaption b { display: inline-block; min-width: 30px; padding: 1px 8px; margin-right: 6px; border-radius: 9px; background: var(--chip); color: #15202e; text-align: center; }
  @media (max-width: 540px) { figure { width: calc(50% - 9px); } }
</style>
</head>
<body>
<h1>Battle Arena tutorial</h1>
<h2>English · 402</h2>
<div class="row">
  <figure><img src="1-yours-en.png" alt=""><figcaption><b>1</b>Yours + Health</figcaption></figure>
  <figure><img src="2-swap-en.png" alt=""><figcaption><b>2</b>Moves + Swap</figcaption></figure>
  <figure><img src="3-bomb-en.png" alt=""><figcaption><b>3</b>Bomb</figcaption></figure>
  <figure><img src="4-extra-en.png" alt=""><figcaption><b>4</b>Extra move</figcaption></figure>
  <figure><img src="6a-stage-en.png" alt=""><figcaption><b>6a</b>Arena button</figcaption></figure>
  <figure><img src="6b-cpu-en.png" alt=""><figcaption><b>6b</b>Computer's turn</figcaption></figure>
  <figure><img src="6c-power-en.png" alt=""><figcaption><b>6c</b>Powers</figcaption></figure>
</div>
<h2>Español · 360</h2>
<div class="row">
  <figure><img src="1-yours-es.png" alt=""><figcaption><b>1</b>Tuyos + Salud</figcaption></figure>
  <figure><img src="2-swap-es.png" alt=""><figcaption><b>2</b>Jugadas + Cambiar</figcaption></figure>
  <figure><img src="3-bomb-es.png" alt=""><figcaption><b>3</b>Bomba</figcaption></figure>
  <figure><img src="4-extra-es.png" alt=""><figcaption><b>4</b>Jugada extra</figcaption></figure>
  <figure><img src="6a-stage-es.png" alt=""><figcaption><b>6a</b>Escenario</figcaption></figure>
  <figure><img src="6b-cpu-es.png" alt=""><figcaption><b>6b</b>Turno del ordenador</figcaption></figure>
  <figure><img src="6c-power-es.png" alt=""><figcaption><b>6c</b>Poderes</figcaption></figure>
</div>
<div style="height:24px"></div>
</body>
</html>
