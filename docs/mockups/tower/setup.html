<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tower setup (mockup)</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#f4f6fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#16243a;width:402px;height:874px;overflow:hidden}
.top{height:56px;display:flex;align-items:center;padding:0 12px}
.ic{width:44px;height:44px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(16,30,54,.08);display:grid;place-items:center;font-size:24px;color:#16243a}
.herorow{position:relative;display:flex;justify-content:center;margin-top:4px}
.hero{width:250px;height:250px;border-radius:24px;overflow:hidden;box-shadow:0 6px 20px rgba(16,30,54,.14)}
.q{position:absolute;right:28px;top:0;width:44px;height:44px;border-radius:999px;background:#fff;box-shadow:0 2px 8px rgba(16,30,54,.10);display:grid;place-items:center;font-weight:800;font-size:20px}
.head{text-align:center;margin:16px 0 14px}
h1{font-size:34px;font-weight:800}
.best{font-size:16px;color:#5b6b82;margin-top:2px}.best b{color:#16243a}
.card{background:#fff;border-radius:16px;margin:0 16px;padding:14px;box-shadow:0 2px 8px rgba(16,30,54,.10)}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.look{position:relative;border:2px solid rgba(16,36,58,.14);border-radius:12px;padding:6px 6px 6px;text-align:center;font-size:14px;font-weight:700}
.look svg{display:block;width:100%;height:44px;border-radius:8px}
.look.sel{border-color:#ffce3a;box-shadow:0 0 0 2px #ffce3a}
.chk{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:999px;background:#ffce3a;font-size:13px;display:grid;place-items:center;font-weight:900}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.seg{border:2px solid rgba(16,36,58,.14);border-radius:12px;padding:8px 2px;text-align:center}
.seg.sel{border-color:#ffce3a;box-shadow:0 0 0 2px #ffce3a}
.seg .t{display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:800}
.seg .n{font-size:13px;color:#5b6b82;margin-top:2px}
.play{margin-top:14px;height:56px;border-radius:999px;background:#ffce3a;display:grid;place-items:center;font-size:20px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.lead{margin:12px 16px 0;background:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(16,30,54,.10);font-size:16px}
.lead .who{display:flex;align-items:center;gap:8px;font-weight:700}
.lead .who span.n{color:#5b6b82;font-weight:600}
.lead .lb{color:#1769d4;font-weight:700}
</style></head><body>
<div class="top"><div class="ic">&#8249;</div></div>

<div class="herorow">
  <div class="hero">
    <svg viewBox="0 0 250 250" width="250" height="250">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5aa8"/><stop offset="1" stop-color="#f0a084"/></linearGradient></defs>
      <rect width="250" height="250" fill="url(#sky)"/>
      <g fill="rgba(20,30,60,.25)"><rect x="0" y="150" width="28" height="100"/><rect x="34" y="170" width="24" height="80"/><rect x="190" y="140" width="26" height="110"/><rect x="222" y="165" width="30" height="85"/></g>
      <rect x="0" y="218" width="250" height="32" fill="#2b3a55"/><rect x="0" y="218" width="250" height="4" fill="#3d5070"/>
      <g id="st"></g>
    </svg>
  </div>
  <div class="q">?</div>
</div>

<div class="head"><h1>Tower</h1><p class="best">&#9733; <b>41</b></p></div>

<div class="card">
  <div class="looks">
    <div class="look sel"><span class="chk">&#10003;</span>
      <svg viewBox="0 0 100 44"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eaaf0"/><stop offset="1" stop-color="#c8e6ff"/></linearGradient></defs><rect width="100" height="44" fill="url(#a)"/><g fill="rgba(20,30,60,.25)"><rect x="4" y="20" width="12" height="24"/><rect x="80" y="16" width="14" height="28"/></g><rect x="38" y="34" width="24" height="7" fill="#e0532f"/><rect x="40" y="27" width="20" height="7" fill="#f2b705"/><rect x="41" y="20" width="18" height="7" fill="#178a7a"/></svg>City</div>
    <div class="look">
      <svg viewBox="0 0 100 44"><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f2"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs><rect width="100" height="44" fill="url(#b)"/><path d="M0 44 L18 22 L34 44 Z M66 44 L84 18 L100 40 L100 44Z" fill="#d6eaf5"/><rect x="38" y="34" width="24" height="7" fill="#7fc3e0"/><rect x="40" y="27" width="20" height="7" fill="#a6d8ec"/><rect x="41" y="20" width="18" height="7" fill="#5aa9cf"/></svg>Ice</div>
    <div class="look">
      <svg viewBox="0 0 100 44"><rect width="100" height="44" fill="#0e1433"/><g fill="#fff"><rect x="10" y="8" width="2" height="2"/><rect x="30" y="16" width="2" height="2"/><rect x="72" y="6" width="2" height="2"/><rect x="88" y="22" width="2" height="2"/><rect x="18" y="30" width="2" height="2"/></g><circle cx="82" cy="12" r="6" fill="#f2b705"/><rect x="38" y="34" width="24" height="7" fill="#6a5acd"/><rect x="40" y="27" width="20" height="7" fill="#8f7fe8"/><rect x="41" y="20" width="18" height="7" fill="#b3a6ff"/></svg>Space</div>
  </div>

  <div class="segs">
    <div class="seg"><div class="t"><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#F2B705"/></svg>Easy</div><div class="n">&#9733; 63</div></div>
    <div class="seg sel"><div class="t"><svg width="12" height="12"><path d="M6 1 L11 11 L1 11Z" fill="#1F5FA8"/></svg>Medium</div><div class="n">&#9733; 41</div></div>
    <div class="seg"><div class="t"><svg width="12" height="12"><rect x="1" y="1" width="10" height="10" fill="#E0532F"/></svg>Hard</div><div class="n">&#9733; 22</div></div>
    <div class="seg"><div class="t"><svg width="12" height="12"><path d="M6 0 L12 6 L6 12 L0 6Z" fill="#178A7A"/></svg>Expert</div><div class="n">&#9733; 9</div></div>
  </div>

  <div class="play">Play</div>
</div>

<div class="lead">
  <div class="who">&#127942; <span>&#128059; Sam</span><span class="n">58</span></div>
  <div class="lb">Leaderboard &#8250;</div>
</div>

<script>
// Draw a preview tower in the hero.
const g = document.getElementById('st'); let w = 150, x = 50; const offs=[0,6,-4,0,8,0,-5,3,0];
for (let i = 0; i < 9; i++) {
  x += offs[i]; if (offs[i] > 0) w -= offs[i]; else w += offs[i];
  const y = 218 - (i + 1) * 20, h = (200 + i * 9) % 360;
  g.insertAdjacentHTML('beforeend',
   `<rect x="${x}" y="${y+4}" width="${w}" height="16" fill="hsl(${h} 62% 50%)"/><rect x="${x}" y="${y}" width="${w}" height="4" fill="hsl(${h} 70% 62%)"/><rect x="${x}" y="${y+17}" width="${w}" height="3" fill="hsl(${h} 55% 38%)"/>`);
}
g.insertAdjacentHTML('beforeend', `<rect x="${x+30}" y="${218-10*20}" width="${w}" height="20" fill="hsl(290 62% 50%)"/>`);
</script>
</body></html>
