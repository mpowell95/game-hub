<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brick Blitz</title>
  <link rel="stylesheet" href="css/brick-blitz.css">
  <style>body { margin: 0; background: #12002b; }</style>
</head>
<body>
  <div id="brick-blitz"></div>
  <script type="module">
    // The app is not playable without a name (see js/name-gate.js): this standalone page is a
    // door into the hub too, and an ungated one is where the leaderboard's nameless device
    // records came from. `requireName()` is a no-op once this device has a name.
    import { requireName } from '../js/name-gate.js';
    import { init } from './js/ui.js';
    await requireName();
    init(document.getElementById('brick-blitz'));
  </script>
</body>
</html>
