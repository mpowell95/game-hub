<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12100d">
  <title>Poolv2</title>
  <style>
    html, body { margin: 0; min-height: 100%; height: 100%; background: #12100d; }
    #poolv2 { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="poolv2"></div>

  <!-- Standalone host. In the hub, the shell calls init(container)/destroy() instead. -->
  <script type="module">
    // The app is not playable without a name (see js/name-gate.js): this standalone page is a
    // door into the hub too, and an ungated one is where the leaderboard's nameless device
    // records came from. `requireName()` is a no-op once this device has a name.
    import { requireName } from '../js/name-gate.js';
    import { init } from './js/ui.js';
    await requireName();
    init(document.getElementById('poolv2'));
  </script>
</body>
</html>
