<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Matt's Game Hub</title>
  <meta name="description" content="A small hub of self-contained games. No ads, fully offline.">
  <meta name="theme-color" content="#1769d4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- THEME BEFORE FIRST PAINT (2026-09-01). Matt: navigating between the hub and the profile
       "flash[es] a white screen... not smooth at all". Three paints were happening: the browser's
       own white canvas during the cross-document navigation, then hub.css's LIGHT --hub-bg
       (#f4f6fb) once the stylesheet applied, and only then the dark one - because .gh-dark is
       stamped by js/theme.js, which rides a deferred <script type="module"> and therefore runs
       after the document has already been parsed and painted.
       This runs SYNCHRONOUSLY, before the stylesheet is even requested, so the class is on <html>
       for the first paint. The inline <style> gives that paint a background with no network wait,
       and color-scheme tells the browser to paint ITS canvas (and scrollbars) to match, which is
       what closes the gap during the navigation itself.
       THE TWO HEX VALUES AND THE KEY BELOW DUPLICATE css/hub.css's --hub-bg and js/theme.js's
       storage key. They are the price of running before both files exist; keep them in step. -->
  <script>
    try {
      var t = localStorage.getItem('gamehub.theme.v1');
      if (t !== 'light' && (t === 'dark' || matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.className += ' gh-dark';
      }
    } catch (e) { /* private mode: the deferred module still themes it a moment later */ }
  </script>
  <style>
    :root { color-scheme: light; background: #f4f6fb; }
    :root.gh-dark { color-scheme: dark; background: #0e1420; }
  </style>
  <link rel="stylesheet" href="css/hub.css">
</head>
<body>
  <!-- FIRST-PAINT SKELETON (2026-09-01). Matt, on coming BACK from the profile: "It still
       flashes. Black now... i still don't want that."
       This div used to ship empty, and js/hub.js builds the entire launcher, so the browser had
       nothing to paint until that module graph had loaded and run - a measured 120ms of correctly
       coloured NOTHING on every return trip. (Going the other way is already 0ms: profile/ is real
       markup.) A cross-document view transition cannot fix it either, because what it fades to IS
       that blank first paint.
       So the first paint now has the app's own chrome and the shape of the grid. js/hub.js does
       `this.root.innerHTML = ...`, which replaces all of this the moment it runs, so there is
       nothing to keep in step except the title - which is a literal in hub.js too, not a t() key,
       precisely because it is a proper noun. NO other text here: a label in the wrong language for
       a moment would be a worse flash than the one being fixed. aria-hidden because it is
       scaffolding; the real UI announces itself a frame later. -->
  <div id="hub-root">
    <div class="hub hub-skel" aria-hidden="true">
      <header class="hub-top">
        <div class="hub-top-info"><h1 class="hub-top-title">Matt&#39;s Game Hub</h1></div>
      </header>
      <main class="hub-main">
        <section class="hub-grid">
          <span class="hub-cell"><span class="hub-card hub-card-skel"></span></span>
          <span class="hub-cell"><span class="hub-card hub-card-skel"></span></span>
          <span class="hub-cell"><span class="hub-card hub-card-skel"></span></span>
          <span class="hub-cell"><span class="hub-card hub-card-skel"></span></span>
          <span class="hub-cell"><span class="hub-card hub-card-skel"></span></span>
          <span class="hub-cell"><span class="hub-card hub-card-skel"></span></span>
        </section>
      </main>
    </div>
  </div>

  <!-- BOOT GUARD (2026-08-04) - a white screen must never again be the whole error message.
       Matt hit a hub that rendered nothing at all, in Chrome AND from the home-screen icon, with
       no way to see why: iOS has no devtools, the page was blank, so there was literally nothing
       to report but "white screen". Every check that could be run from a laptop came back green
       (every module 200s, the shell code was byte-identical to the build that had worked an hour
       earlier, and it all loaded fine in a desktop browser), which is exactly the situation this
       guard exists for - a failure only reproducible on the real device.

       Three parts, all classic script so they run even if the module graph below never parses:
         1. error/unhandledrejection listeners registered BEFORE the module tag, so a syntax
            error or a failed import is captured rather than lost to the console.
         2. a watchdog: if #hub-root is still empty after BOOT_TIMEOUT_MS, show what was caught.
         3. `?reset=sw` - unregister the service worker + delete its caches, then reload.

       THE LAW: the reset path clears the SW registration and the CACHE STORAGE ONLY. It never
       touches localStorage, so the profile, gamehub.stats and every game's save survive it. That
       distinction is the whole reason this exists instead of telling a player to clear site data,
       which on a phone wipes unsynced history that is nowhere else. Do not "simplify" it into a
       clear-everything button. -->
  <script>
    (function () {
      var BOOT_TIMEOUT_MS = 6000;
      var errs = [];
      var shown = false;
      // Collected up front so the panel can report the ACTUAL cache/worker state, which is the
      // thing most likely to be wrong when the page renders nothing.
      var env = { caches: 'pending', sw: 'pending' };
      try {
        if (window.caches && caches.keys) {
          caches.keys().then(function (k) { env.caches = k.join(', ') || '(none)'; },
            function (e) { env.caches = 'error: ' + e; });
        } else { env.caches = '(unsupported)'; }
        if (navigator.serviceWorker) {
          env.sw = navigator.serviceWorker.controller ? 'controlled' : 'not controlled';
        } else { env.sw = '(unsupported)'; }
      } catch (e) { env.caches = 'error: ' + e; }

      function note(what) { errs.push(what); if (document.getElementById('gh-boot-err')) render(); }
      // The module tag below reports its own import failure through this, because a failed
      // static import never fires a window error event anywhere useful.
      window.__ghBootNote = note;

      window.addEventListener('error', function (e) {
        // A failed <script>/module fetch fires an error event on the ELEMENT (no e.message).
        if (e && e.target && e.target !== window && (e.target.src || e.target.href)) {
          note('Failed to load: ' + (e.target.src || e.target.href));
        } else if (e && e.message) {
          note(e.message + (e.filename ? '\n  at ' + e.filename + ':' + (e.lineno || 0) : ''));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        note('Unhandled: ' + ((r && (r.stack || r.message)) || String(r)));
      });

      function resetSW() {
        var done = function () { location.replace(location.pathname); };
        var jobs = [];
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
        } catch (e) { /* fall through to the reload regardless */ }
        Promise.all(jobs).then(done, done);
        setTimeout(done, 4000);
      }

      // Escape hatch that works even when nothing else on the page does: load .../?reset=sw
      if (/[?&]reset=sw\b/.test(location.search)) { resetSW(); return; }

      function render() {
        var root = document.getElementById('hub-root');
        if (!root) return;
        var box = document.getElementById('gh-boot-err');
        if (!box) {
          box = document.createElement('div');
          box.id = 'gh-boot-err';
          box.setAttribute('style', 'font:14px/1.5 system-ui,-apple-system,sans-serif;padding:18px;'
            + 'max-width:640px;margin:0 auto;color:#1c2430;');
          box.innerHTML = '<h1 style="font-size:1.05rem;margin:0 0 6px">The hub did not start</h1>'
            + '<p style="margin:0 0 12px;color:#5b6675">Most often a stuck offline cache. Resetting it '
            + 'is safe: it clears the cached app files only, never your profile, stats or saved games.</p>'
            + '<button id="gh-boot-reset" style="appearance:none;border:0;border-radius:10px;padding:12px 16px;'
            + 'background:#1769d4;color:#fff;font:inherit;font-weight:700;width:100%;margin-bottom:14px">'
            + 'Reset the app cache and reload</button>'
            + '<pre id="gh-boot-log" style="white-space:pre-wrap;word-break:break-word;background:#f1f4f9;'
            + 'padding:12px;border-radius:8px;font-size:12px;margin:0;color:#40331f"></pre>';
          root.appendChild(box);
          document.getElementById('gh-boot-reset').addEventListener('click', resetSW);
        }
        document.getElementById('gh-boot-log').textContent =
          (errs.length ? errs.join('\n\n') : 'No JavaScript error was reported. The page loaded but '
            + 'rendered nothing, which usually means a cached file is stale or truncated.')
          + '\n\n---\ncaches: ' + env.caches
          + '\nservice worker: ' + env.sw
          + '\nurl: ' + location.href
          + '\nua: ' + navigator.userAgent;
      }

      setTimeout(function () {
        var root = document.getElementById('hub-root');
        if (shown || !root) return;
        if (root.children.length > 0) return;   // hub mounted fine, stand down
        shown = true;

        // AUTO-RECOVER, once per tab, BEFORE showing anyone an error panel. The overwhelmingly
        // common cause of a hub that renders nothing is a stuck offline cache, and the fix for it
        // is mechanical -- there is no reason to make a player read an error and tap a button to
        // apply a repair the page can just perform. `sessionStorage` (not localStorage: it dies
        // with the tab, so it can never wedge a device permanently) makes this strictly one
        // attempt; if the reload still comes up empty, the panel is shown instead and the player
        // gets the actual error rather than a reload loop.
        var TRIED = 'gh.bootRecovered.v1';
        var tried = false;
        try { tried = sessionStorage.getItem(TRIED) === '1'; } catch (e) { tried = true; }
        if (!tried) {
          try { sessionStorage.setItem(TRIED, '1'); } catch (e) { /* fall through to the panel */ }
          resetSW();
          return;
        }
        render();
      }, BOOT_TIMEOUT_MS);
    }());
  </script>

  <script type="module">
    // Dynamic import, not a static one, ON PURPOSE (2026-08-04). A static `import` that fails --
    // a 404, a truncated cached file, a parse error anywhere in the graph -- aborts this script
    // before its first line runs, and in a browser without devtools that is indistinguishable
    // from a white screen with no cause. Awaiting the import instead makes that failure a
    // catchable rejection, so the boot guard above can name the file that actually broke.
    // The behaviour on a healthy load is identical; do not "tidy" this back to a static import.
    try {
      const [{ initHub }, { initA2HSPrompt }] = await Promise.all([
        import('./js/hub.js'),
        import('./js/a2hs.js'),
      ]);
      initHub(document.getElementById('hub-root'));
      initA2HSPrompt();
    } catch (e) {
      if (window.__ghBootNote) window.__ghBootNote('Hub failed to start:\n' + ((e && (e.stack || e.message)) || String(e)));
      throw e;
    }

    // Register the service worker (offline + installable). Ignored on file://.
    //
    // readyState check (2026-08-23): this line runs AFTER the awaited dynamic imports above, and
    // the window 'load' event does NOT wait for those - so on a slow connection load has often
    // already fired by the time this executes, and a bare addEventListener('load') callback would
    // simply never run. Measured for real: with modules throttled, load fired at ~285 ms while
    // the import chain finished at ~750 ms, and the SW never registered at all on a first visit.
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      const registerSW = () => {
        navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW registration failed', e));
      };
      if (document.readyState === 'complete') registerSW();
      else window.addEventListener('load', registerSW);
    }
  </script>
</body>
</html>
