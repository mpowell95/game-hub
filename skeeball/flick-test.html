<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skeeball flick test</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    position: fixed; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
  }
  body {
    background: #191019; color: #f7ecd8;
    font: 14px/1.3 system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }

  #head { flex: 0 0 auto; padding: 6px 12px 0; text-align: center; }
  #val { font-size: 46px; font-weight: 800; line-height: 1; }
  #sub { font-size: 11px; opacity: .7; margin-top: 1px; }

  #tags { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 8px 8px 4px; flex: 0 0 auto; }
  #tags button {
    padding: 10px 2px; font-size: 11px; font-weight: 600; line-height: 1.2;
    border: 0; border-radius: 10px; background: #2b5ea7; color: #fff;
  }
  #tags button b { font-size: 19px; font-weight: 800; }
  #tags button:disabled { opacity: .28; }
  #undo { background: #5a3a2a !important; }

  #out {
    flex: 0 0 auto; padding: 6px 10px 8px; font-size: 11px; white-space: pre;
    font-family: ui-monospace, Menlo, Consolas, monospace; background: #120b12;
  }
  #reset { flex: 0 0 auto; margin: 6px 10px; padding: 7px;
    border: 1px solid #55414f; background: transparent; color: #c9b8c6;
    border-radius: 9px; font-size: 12px; }

  #pad {
    flex: 1 1 auto; position: relative; min-height: 150px;
    background: linear-gradient(180deg, #7c4d22, #a86f38);
    touch-action: none; overflow: hidden;
  }
  #pad::after {
    content: 'flick UP from here';
    position: absolute; inset: auto 0 10px 0; text-align: center;
    font-size: 12px; opacity: .55;
  }
</style>
</head>
<body>

<div id="head">
  <div id="val">-</div>
  <div id="sub">screen-heights/sec &nbsp;·&nbsp; <span id="derived">-</span></div>
</div>

<div id="tags">
  <button data-k="s1"><b>1</b><br>slowest<br>I can</button>
  <button data-k="s2"><b>2</b><br>just reach<br>the board</button>
  <button data-k="s3"><b>3</b><br>very<br>slow</button>
  <button data-k="s4"><b>4</b><br>slow</button>
  <button data-k="s5"><b>5</b><br>easy<br>lob</button>
  <button data-k="s6"><b>6</b><br>normal</button>
  <button data-k="s7"><b>7</b><br>firm</button>
  <button data-k="s8"><b>8</b><br>hard</button>
  <button data-k="s9"><b>9</b><br>aiming<br>for a 100</button>
  <button data-k="s10"><b>10</b><br>hardest<br>I can</button>
  <button id="undo">undo last</button>
</div>

<div id="out"></div>
<button id="reset">clear all</button>

<div id="pad"></div>

<script type="module">
// The measurement comes from the GAME'S OWN MODULE - not a copy of it. That is the whole point of
// this file existing: an earlier version hand-copied ui.js's maths, the two drifted inside one
// edit, and this page then printed confident readings on a scale the game did not use.
import { swipeSpeed, powerOf, launchSpeed, SWIPE_SLOW, SWIPE_FAST } from './js/swipe.js';
import { BOARDS } from './js/boards.js';

const G = BOARDS[0].geom;
const pad = document.getElementById('pad');
const val = document.getElementById('val');
const derived = document.getElementById('derived');
const out = document.getElementById('out');
const buttons = [...document.querySelectorAll('#tags button[data-k]')];

// Numbered slowest to hardest, so the readings come back in an order that reads straight down the
// column and each row's own number says where it sits on the scale.
const KEYS = ['s1', 's2', 's3', 's4', 's5', 's6', 's7', 's8', 's9', 's10'];
const LABEL = {
  s1: ' 1 slowest', s2: ' 2 reach board', s3: ' 3 very slow', s4: ' 4 slow', s5: ' 5 easy lob',
  s6: ' 6 normal', s7: ' 7 firm', s8: ' 8 hard', s9: ' 9 for a 100', s10: '10 hardest',
};

let samples = null;
let last = null;
let order = [];                                  // for undo
let data = Object.fromEntries(KEYS.map((k) => [k, []]));

pad.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

pad.addEventListener('pointerdown', (e) => {
  samples = [{ x: e.clientX, y: e.clientY, t: e.timeStamp }];
  pad.setPointerCapture(e.pointerId);
});
pad.addEventListener('pointermove', (e) => {
  if (samples) samples.push({ x: e.clientX, y: e.clientY, t: e.timeStamp });
});
pad.addEventListener('pointerup', (e) => {
  if (!samples) return;
  samples.push({ x: e.clientX, y: e.clientY, t: e.timeStamp });
  const s = samples; samples = null;

  const perH = swipeSpeed(s, window.innerHeight);
  if (perH == null) { val.textContent = '-'; derived.textContent = 'too short to count'; return; }
  last = perH;
  val.textContent = perH.toFixed(2);
  const p = powerOf(perH);
  derived.textContent = 'power ' + p.toFixed(2) + '  ·  ' + launchSpeed(p, G.minSpeed, G.maxSpeed).toFixed(2) + ' m/s';
  buttons.forEach((b) => { b.disabled = false; });
});

buttons.forEach((b) => b.addEventListener('click', () => {
  if (last == null) return;
  data[b.dataset.k].push(last);
  order.push(b.dataset.k);
  last = null;
  buttons.forEach((x) => { x.disabled = true; });
  render();
}));

document.getElementById('undo').addEventListener('click', () => {
  const k = order.pop();
  if (k) data[k].pop();
  render();
});

document.getElementById('reset').addEventListener('click', () => {
  data = Object.fromEntries(KEYS.map((k) => [k, []]));
  order = []; last = null;
  val.textContent = '-'; derived.textContent = '-';
  buttons.forEach((x) => { x.disabled = true; });
  render();
});

function row(k) {
  const a = data[k];
  if (!a.length) return LABEL[k].padEnd(15) + '-';
  const lo = Math.min(...a), hi = Math.max(...a);
  const avg = a.reduce((p, c) => p + c, 0) / a.length;
  return LABEL[k].padEnd(15) + 'n=' + String(a.length).padEnd(3)
    + 'avg ' + avg.toFixed(2) + '   ' + lo.toFixed(2) + '..' + hi.toFixed(2);
}
function render() {
  out.textContent = KEYS.map(row).join('\n')
    + '\n\ncurrent: SLOW ' + SWIPE_SLOW.toFixed(2) + '  FAST ' + SWIPE_FAST.toFixed(2)
    + '\nscreenshot this and send it';
}
render();
</script>
</body>
</html>
