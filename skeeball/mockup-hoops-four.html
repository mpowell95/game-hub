<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect 4 Hoops</title>
<style>
  :root{ --bg:#14100c; --ink:#f3ece1; --dim:#9b8f7e; --panel:#1d170f; --edge:#33271a;
         --cab:#2a2a2d; --cabEdge:#141416; --gold:#ffd977;
         --red:#e8463f; --redHi:#ff7a6e; --yellow:#ffce3a; --yellowHi:#ffe488;
         --boardBlue:#1f5fa8; --win:#2e9d4a; --orange:#e8541f; --bad:#e0532f; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px 16px 40px}
  h1{font:700 20px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;margin:0 0 4px;color:var(--gold)}
  .sub{color:var(--dim);font-size:13px;margin:0 0 22px}
  .wrap{max-width:1000px}
  .grid{display:grid;gap:20px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:16px;margin-bottom:20px}
  .nm{font:700 15px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.09em;margin:0 0 3px}
  .hook{color:var(--dim);font-size:12.5px;margin:0 0 12px}
  svg{display:block;margin:0 auto}
  table{border-collapse:collapse;font-size:13px;width:100%;margin-top:6px}
  td{padding:3px 0;color:var(--dim);vertical-align:top}
  td.k{color:var(--ink);font-weight:700;padding-right:10px;white-space:nowrap;width:1%}
  .note{color:var(--dim);font-size:12px;margin:10px 0 0;border-top:1px solid var(--edge);padding-top:8px}
</style></head><body>
<div class="wrap">
<h1>CONNECT 4 HOOPS</h1>
<p class="sub">7 hoops, 7 x 6 board, red vs yellow. Sink a hoop, your ball drops down that column.</p>
<div id="g"></div>
</div>
<script>
const C=7, R=6, CELL=40, GAP=5;
const GW=C*CELL+(C-1)*GAP, PADX=16, HOOPH=74;
const SW=GW+PADX*2, GTOP=HOOPH+30;
const SH=GTOP+R*CELL+(R-1)*GAP+34;
const cx=c=>PADX+c*(CELL+GAP)+CELL/2;
const cy=r=>GTOP+(R-1-r)*(CELL+GAP)+CELL/2;

function hoop(c,lit){
  const x=cx(c), y=26, w=19;
  return `<g>
    <rect x="${x-16}" y="${y-20}" width="32" height="22" rx="2" fill="#efe9dc" stroke="#b9b3a8"/>
    <rect x="${x-7}" y="${y-15}" width="14" height="11" fill="none" stroke="#9aa6c4" stroke-width="1.2"/>
    <ellipse cx="${x}" cy="${y+4}" rx="${w/2+3}" ry="3.2" fill="none" stroke="${lit?'var(--gold)':'var(--orange)'}" stroke-width="2.6"/>
    <path d="M${x-w/2-2} ${y+5} L${x-w/2+3} ${y+22} L${x+w/2-3} ${y+22} L${x+w/2+2} ${y+5}"
          fill="none" stroke="#cfcabf" stroke-width="1"/>
    <path d="M${x-w/2+1} ${y+13} L${x+w/2-1} ${y+13} M${x-3} ${y+5} L${x-1} ${y+22} M${x+3} ${y+5} L${x+1} ${y+22}"
          stroke="#cfcabf" stroke-width=".9" fill="none" opacity=".8"/>
    <text x="${x}" y="${y+36}" text-anchor="middle" font-size="10" font-weight="700"
          fill="${lit?'var(--gold)':'#77695a'}">${c+1}</text></g>`;
}
// Plain red and yellow BASKETBALLS - the real cabinet's two ball colours. The seams
// are a basketball's seams, not an accessibility marker; nothing here needs one.
function ballDisc(x,y,who,win,rr){
  rr=rr||CELL/2-3;
  const f=who==='R'?'var(--red)':'var(--yellow)';
  const hi=who==='R'?'var(--redHi)':'var(--yellowHi)';
  const seam=who==='R'?'rgba(90,10,6,.55)':'rgba(120,80,0,.45)';
  return `<g><circle cx="${x}" cy="${y}" r="${rr}" fill="${f}" stroke="${win?'var(--win)':hi}" stroke-width="${win?3.2:1.4}"/>
    <path d="M${x-rr} ${y} h${rr*2} M${x} ${y-rr} v${rr*2}" stroke="${seam}" stroke-width="1.3" fill="none"/>
    <path d="M${x-rr*0.72} ${y-rr*0.72} Q${x} ${y} ${x-rr*0.72} ${y+rr*0.72}
             M${x+rr*0.72} ${y-rr*0.72} Q${x} ${y} ${x+rr*0.72} ${y+rr*0.72}"
          stroke="${seam}" stroke-width="1.1" fill="none"/></g>`;
}
function board(cols,winCells,lit){
  let s=`<svg width="${SW}" height="${SH}" viewBox="0 0 ${SW} ${SH}">
    <rect x="1" y="1" width="${SW-2}" height="${SH-2}" rx="10" fill="var(--cab)" stroke="var(--cabEdge)"/>`;
  for(let c=0;c<C;c++) s+=hoop(c, lit===c);
  s+=`<rect x="${PADX-8}" y="${GTOP-10}" width="${GW+16}" height="${R*CELL+(R-1)*GAP+20}" rx="6"
        fill="var(--boardBlue)" stroke="#164a86"/>`;
  for(let c=0;c<C;c++) for(let r=0;r<R;r++){
    const who=(cols[c]||[])[r];
    const win=winCells.some(w=>w[0]===c&&w[1]===r);
    s+=`<circle cx="${cx(c)}" cy="${cy(r)}" r="${CELL/2-3}" fill="#0d2c52" stroke="#3a74b5" stroke-width="1"/>`;
    if(who) s+=ballDisc(cx(c),cy(r),who,win);
  }
  return s+'</svg>';
}
function tbl(rows){return '<table>'+rows.map(([k,v])=>`<tr><td class="k">${k}</td><td>${v}</td></tr>`).join('')+'</table>';}

const POS=[['R'],['Y','R'],['Y','Y','R'],['Y','R','Y','R'],['R'],[],[]];
const WIN=[[0,0],[1,1],[2,2],[3,3]];

function sideView(){
  const W=430,H=225;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
   <rect x="0" y="0" width="${W}" height="${H}" rx="8" fill="#191519"/>
   <path d="M18 186 L150 186" stroke="#a86f38" stroke-width="7" stroke-linecap="round"/>
   <path d="M150 186 Q196 184 210 150" stroke="#a86f38" stroke-width="7" fill="none" stroke-linecap="round"/>
   <text x="70" y="205" font-size="10" fill="#77695a">lane (swipe here)</text>
   <text x="176" y="205" font-size="10" fill="#77695a">ramp</text>
   <path d="M210 148 Q286 40 344 92" stroke="var(--gold)" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
   ${ballDisc(210,148,'R',false,7)}
   <g opacity=".5">${ballDisc(278,72,'R',false,7)}</g>
   <rect x="330" y="58" width="6" height="26" fill="#efe9dc"/>
   <ellipse cx="350" cy="86" rx="16" ry="4" fill="none" stroke="var(--orange)" stroke-width="2.6"/>
   <path d="M335 88 L339 104 L361 104 L365 88" fill="none" stroke="#cfcabf" stroke-width="1"/>
   <text x="350" y="50" text-anchor="middle" font-size="10" fill="var(--gold)">hoop 4</text>
   <rect x="332" y="112" width="36" height="86" rx="4" fill="var(--boardBlue)" stroke="#164a86"/>
   ${[0,1,2].map(i=>`<circle cx="350" cy="${128+i*28}" r="13" fill="#0d2c52" stroke="#3a74b5"/>`).join('')}
   ${ballDisc(350,184,'R',false,13)}
   <path d="M350 100 L350 160" stroke="var(--gold)" stroke-width="1.4" stroke-dasharray="3 3"/>
   <text x="322" y="150" text-anchor="end" font-size="10" fill="#77695a">column 4,</text>
   <text x="322" y="164" text-anchor="end" font-size="10" fill="#77695a">fills from</text>
   <text x="322" y="178" text-anchor="end" font-size="10" fill="#77695a">the bottom</text>
  </svg>`;
}

function flow(){
  const W=430,H=225;
  const box=(x,y,w,h,f,s)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${f}" stroke="${s}"/>`;
  const ar=(x1,y1,x2,y2)=>`<path d="M${x1} ${y1} L${x2} ${y2}" stroke="#77695a" stroke-width="1.4" marker-end="url(#ah)"/>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
   <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
     <path d="M0 0 L10 5 L0 10 z" fill="#77695a"/></marker></defs>
   <rect x="0" y="0" width="${W}" height="${H}" rx="8" fill="#191519"/>
   ${box(16,22,120,52,'rgba(232,70,63,.16)','var(--red)')}
   <text x="76" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="var(--red)">YOU</text>
   <text x="76" y="58" text-anchor="middle" font-size="10" fill="var(--dim)">shoot until one</text>
   <text x="76" y="69" text-anchor="middle" font-size="10" fill="var(--dim)">goes in</text>
   ${box(294,22,120,52,'rgba(255,206,58,.14)','var(--yellow)')}
   <text x="354" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="var(--yellow)">THEM</text>
   <text x="354" y="58" text-anchor="middle" font-size="10" fill="var(--dim)">badge on the hub,</text>
   <text x="354" y="69" text-anchor="middle" font-size="10" fill="var(--dim)">next time they open</text>
   ${box(150,32,130,32,'#12100e','#4e463b')}
   <text x="215" y="52" text-anchor="middle" font-size="10" fill="var(--gold)">move appended</text>
   ${ar(138,48,148,48)} ${ar(282,48,292,48)} ${ar(354,80,354,100)}
   ${box(120,102,190,40,'#12100e','#4e463b')}
   <text x="215" y="118" text-anchor="middle" font-size="10" fill="var(--ink)">hoops/games/&lt;pairKey&gt;/&lt;id&gt;</text>
   <text x="215" y="133" text-anchor="middle" font-size="9.5" fill="var(--dim)">append-only move list, never deleted</text>
   ${ar(120,122,76,122)} ${ar(76,122,76,80)}
   ${box(120,158,190,40,'#12100e','#4e463b')}
   <text x="215" y="174" text-anchor="middle" font-size="10" fill="var(--ink)">hoops/index/&lt;CODE&gt;/&lt;other&gt;</text>
   <text x="215" y="189" text-anchor="middle" font-size="9.5" fill="var(--dim)">one read drives the badge (Messages' shape)</text>
   ${ar(215,146,215,156)}
  </svg>`;
}

// where each column's baskets actually came from, on the aim dial
function aimBands(){
  const W=900,H=190,L=60,Rt=W-40,mid=x=>L+((x+1)/2)*(Rt-L);
  const D=[[1,-0.42,0.16],[2,-0.34,0.20],[3,-0.20,0.22],[4,-0.02,0.22],[5,0.18,0.22],[6,0.34,0.19],[7,0.42,0.16]];
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect x="0" y="0" width="${W}" height="${H}" rx="8" fill="#191519"/>`;
  s+=`<line x1="${L}" y1="150" x2="${Rt}" y2="150" stroke="#4e463b" stroke-width="1.4"/>`;
  for(const t of [-1,-0.5,0,0.5,1]){
    s+=`<line x1="${mid(t)}" y1="146" x2="${mid(t)}" y2="154" stroke="#4e463b"/>`;
    s+=`<text x="${mid(t)}" y="170" text-anchor="middle" font-size="10" fill="#77695a">${t>0?'+':''}${t}</text>`;
  }
  s+=`<text x="${L-8}" y="154" text-anchor="end" font-size="10" fill="#77695a">aim</text>`;
  s+=`<text x="${mid(-1)}" y="184" text-anchor="start" font-size="10" fill="#77695a">swipe left</text>`;
  s+=`<text x="${mid(1)}" y="184" text-anchor="end" font-size="10" fill="#77695a">swipe right</text>`;
  D.forEach(([n,m,sd],i)=>{
    const y=28+i*16, x0=mid(m-sd), x1=mid(m+sd);
    const col=i<3?'var(--red)':i>3?'var(--yellow)':'var(--gold)';
    s+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${col}" stroke-width="7" stroke-linecap="round" opacity=".75"/>`;
    s+=`<circle cx="${mid(m)}" cy="${y}" r="3.4" fill="#14100c" stroke="${col}" stroke-width="2"/>`;
    s+=`<text x="${mid(m)}" y="${y-8}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${col}">${n}</text>`;
    s+=`<line x1="${mid(m)}" y1="${y+5}" x2="${mid(m)}" y2="148" stroke="${col}" stroke-width=".8" stroke-dasharray="2 3" opacity=".45"/>`;
  });
  return s+'</svg>';
}
// width comparison: 7 rims on the old cabinet vs the wider one
function widths(){
  const W=900,H=150, U=36;            // U = pixels per X
  function row(y,boardX,label,ok){
    const x0=(W-boardX*U)/2;
    let s=`<rect x="${x0}" y="${y}" width="${boardX*U}" height="46" rx="5"
            fill="#2a2a2d" stroke="${ok?'var(--win)':'var(--bad)'}" stroke-width="1.6"/>`;
    const pitch=(boardX-1)/(7-1);
    for(let i=0;i<7;i++){
      const cxp=x0+(0.5+i*pitch)*U;
      s+=`<circle cx="${cxp}" cy="${y+23}" r="${0.5*U}" fill="none"
            stroke="${ok?'var(--win)':'var(--bad)'}" stroke-width="2" opacity=".95"/>`;
    }
    s+=`<text x="${x0}" y="${y-7}" font-size="11.5" font-weight="700" fill="${ok?'var(--win)':'var(--bad)'}">${label}</text>`;
    s+=`<text x="${x0+boardX*U+10}" y="${y+28}" font-size="11" fill="var(--dim)">pitch ${pitch.toFixed(3)}X</text>`;
    return s;
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    ${row(22,6.875,'6.875X  -  every existing machine: the rims OVERLAP',false)}
    ${row(96,8.800,'8.800X  -  7 rims at the standard 0.5X, legally spaced',true)}
  </svg>`;
}

document.getElementById('g').innerHTML=`
 <div class="card"><p class="nm">THE FACE</p>
   <p class="hook">Red went first and just won on the diagonal.</p>
   ${board(POS,WIN,0)}
   <div class="grid" style="margin-top:12px">
     <div>${tbl([['Hoops','7, one per column'],['Board','7 wide x 6 tall'],['Win','4 in a row, any direction']])}</div>
     <div>${tbl([['Red','#e8463f'],['Yellow','#ffce3a'],['Balls','real basketballs, seams and all']])}</div>
   </div></div>

 <div class="card"><p class="nm">THE CABINET HAS TO GET WIDER</p>
   <p class="hook">holes.spacing wants 1.30X between hole centres. Seven of them do not fit the cabinet every other machine uses.</p>
   ${widths()}
   ${tbl([['Needed','6 gaps x 1.30X + 0.5X margin each side = 8.800X'],
          ['Have','6.875X, so the pitch falls to 0.979X'],
          ['Result','rims 1.0X across at 0.979X pitch overlap by 0.021X'],
          ['Fix','widen the cabinet 28%, keeping every rim at the standard 0.5X']])}
   <p class="note">Settled: the cabinet is 8.800X. Widening is the option that touches no rim, and a rim is never mine to change.</p></div>

 <div class="card"><p class="nm">MEASURED: AIM PICKS THE COLUMN</p>
   <p class="hook">861 throws through skeeball's real engine at the widened cabinet. Where each column's shots actually came from.</p>
   ${aimBands()}
   <div class="grid" style="margin-top:12px">
     <div>${tbl([['Every column','reachable, all 7'],['Dead dial','none - 21 of 21 powers score'],
                 ['Ordering','mean aim rises 1 to 7, no inversion']])}</div>
     <div>${tbl([['boardW','6.875X &rarr; <b>8.800X</b>'],['minSpeed / maxSpeed','2.60/6.60 &rarr; <b>4.70/5.60</b>'],
                 ['wallRest','0.15 &rarr; <b>0.03</b>'],['aimMax','0.45, unchanged']])}</div>
   </div>
   <p class="note">The outer columns are the easiest and the middle the hardest, which is the right way round: Connect 4's centre columns carry the most winning lines, so the valuable shot is the hard one.</p></div>

 <div class="grid">
  <div class="card"><p class="nm">THE THROW</p><p class="hook">Skeeball's lane, ramp and arc. The hoop picks the column.</p>
    ${sideView()}
    ${tbl([['Sink any hoop','that is your move, in that column'],['Airball','costs a shot, not your turn'],['Wrong hoop','still counts, in THAT column']])}
    <p class="note">The rim-out into the next hoop is the best moment the format has, and it is already the rule: never steer a ball toward a hole.</p></div>

  <div class="card"><p class="nm">THE MATCH, ASYNC</p><p class="hook">Challenge, shoot, hand it over. Days apart if you like.</p>
    ${flow()}
    ${tbl([['Addressed by','player CODE, so it follows you to every device'],['Turn ends','when a ball goes in, never on a miss'],['They find out','badge when they next open the hub']])}
    <p class="note">No phone push. The repo has no FCM, and Messages says so in as many words - that is its own job.</p></div>
 </div>`;
</script></body></html>
